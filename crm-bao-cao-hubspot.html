<!DOCTYPE html>
<html lang="vi" data-brand="crm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo — HarnexAI CRM (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="crm-shared.css">
<style>
/* ═══ Báo cáo: 2 dashboard CRM Data Overview & Pipeline Overview ═══
   Thẻ báo cáo lấy đúng danh sách trên portal HubSpot của khách (28/09/2026), bỏ thẻ Tickets (ngoài phạm vi).
   Số liệu tính trực tiếp từ dữ liệu mẫu Contacts / Deals / Activities; bấm số hoặc cột để xem danh sách bản ghi.
   Màu biểu đồ: bảng categorical đã kiểm (dataviz), 1 series = 1 màu; trạng thái Open/Won/Lost = 3 slot đầu + nhãn trực tiếp. */
.viz{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--series-1:#2a78d6;--st-open:#2a78d6;--st-won:#1baf7a;--st-lost:#eb6834;--grid:#e6e6e3;--axis:#8a8984;--ink:var(--on-surface);--ink-2:var(--on-surface-variant)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--series-1:#3987e5;--st-open:#3987e5;--st-won:#199e70;--st-lost:#d95926;--grid:#3a3a38;--axis:#8f8e88}}
:root[data-theme="dark"] .viz{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--series-1:#3987e5;--st-open:#3987e5;--st-won:#199e70;--st-lost:#d95926;--grid:#3a3a38;--axis:#8f8e88}
.frame{overflow:auto}
.dh{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--outline-variant);flex-wrap:wrap}
.dh h1{font-size:24px;font-weight:600}
.dsel{display:flex;align-items:center;gap:2px;border-radius:var(--radius-md);padding:0 4px}
.dsel:hover{background:var(--surface-2)}
.dh .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative}
.fl{display:flex;align-items:center;gap:6px;padding:12px 20px;flex-wrap:wrap}
.fl .qfs{height:30px;border:none;background:none;font-weight:600;font-size:13px;color:var(--on-surface);padding:0 6px;border-radius:var(--radius-sm);cursor:pointer}
.fl .qfs:hover{background:var(--surface-2)}
.fl .sepv{width:1px;height:22px;background:var(--outline);margin:0 6px}
.dg{display:grid;grid-template-columns:1fr;gap:14px;padding:0 20px 24px}
@media(min-width:760px){.dg{grid-template-columns:1fr 1fr}}
@media(min-width:1240px){.dg{grid-template-columns:repeat(3,1fr)}}
.rc{border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.rc.w2{grid-column:span 1}@media(min-width:760px){.rc.w2{grid-column:span 2}}
.rc h2{font-size:15px;font-weight:600;color:var(--link);display:flex;align-items:center;gap:6px}
.rc h2 .ms{font-size:16px;color:var(--on-surface-variant)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--on-surface-variant)}
.kpi{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:14px 0;gap:4px}
.kpi small{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--on-surface-variant)}
.kpi button{font-size:40px;font-weight:700;color:var(--link);line-height:1.1}
.kpi button:hover{text-decoration:underline}
.kpi .dl{font-size:12.5px;color:var(--on-surface-variant)}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
.viz text{font-family:inherit}
.viz [data-drill]{cursor:pointer}
.viz [data-drill]:hover{opacity:.85}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--on-surface)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.hb-r{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:10px;align-items:center;font-size:12.5px;cursor:pointer;border-radius:var(--radius-sm);padding:2px 0}
.hb-r:hover{background:var(--surface-variant)}
.hb-l{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hb-t{position:relative;display:block;height:18px;margin-right:72px;min-width:0}
.hb-t i{position:absolute;left:0;top:1px;display:block;height:16px;border-radius:0 4px 4px 0}
.hb-t b{position:absolute;top:0;font-weight:600;white-space:nowrap}
.tt{width:100%;border-collapse:collapse;font-size:13px}
.tt th,.tt td{padding:7px 8px;border-bottom:1px solid var(--outline-variant);text-align:right}
.tt th:first-child,.tt td:first-child{text-align:left}
.tt th{color:var(--on-surface-variant);font-weight:600;font-size:12px}
.tt button{color:var(--link);font-weight:600}
.tip{position:fixed;z-index:999;pointer-events:none;background:var(--on-surface);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:var(--radius-md);box-shadow:var(--shadow-2);display:none;max-width:260px}
.tview{font-size:12px;color:var(--link);font-weight:600;align-self:flex-start}
.drl{display:flex;flex-direction:column}
.drl a{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid var(--outline-variant);font-size:13.5px}
.drl a b{color:var(--link);font-weight:600}
.drl a:hover{background:var(--surface-variant)}

/* Phần 6 — clone dashboard HubSpot (khảo sát 29/09/2026): bộ chọn dashboard có tab + tìm, bộ lọc nhanh dạng popover,
   thẻ báo cáo có thanh công cụ khi rê chuột (kéo để sắp xếp · làm mới · bộ lọc · ⋮), đổi kích thước, gỡ / thêm lại báo cáo. */
.dg{grid-auto-flow:row dense}
@media(min-width:1240px){.rc.s2{grid-column:span 2}.rc.s3{grid-column:span 3}}
@media(min-width:760px) and (max-width:1239px){.rc.s2,.rc.s3{grid-column:span 2}}
.rc{position:relative}
.rc h2 a{color:var(--link)}
.rc h2 a:hover{text-decoration:underline}
.rc-tb{position:absolute;top:10px;right:10px;display:flex;gap:2px;opacity:0;transition:opacity .12s;background:var(--surface);border-radius:var(--radius-md)}
.rc:hover .rc-tb,.rc:focus-within .rc-tb{opacity:1}
.rc-tb button{width:28px;height:28px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--on-surface-variant)}
.rc-tb button:hover{background:var(--surface-2);color:var(--on-surface)}
.rc .grip{position:absolute;top:12px;left:4px;cursor:grab;color:var(--on-surface-variant);opacity:0;font-size:16px}
.rc:hover .grip{opacity:1}
.rc.dragging{opacity:.45}
.rc.dropt{outline:2px dashed var(--primary);outline-offset:2px}
.rc .rsz{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--on-surface-variant);opacity:0}
.rc:hover .rsz{opacity:1}
.rc .rsz:hover{background:var(--surface-2)}
.chips span[title]{cursor:help}
.qf2{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 8px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--on-surface)}
.qf2:hover{background:var(--surface-2)}
.qf2.on{background:var(--primary-container);color:var(--on-primary-container)}
.qf2 .ms{font-size:16px}
#pop{position:absolute;z-index:70;max-height:min(480px,70vh);overflow-y:auto}
.frame{position:relative}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--outline-variant);margin:-6px -6px 8px;padding:0 6px}
.dtabs button{height:40px;padding:0 10px;font-size:13px;font-weight:600;color:var(--on-surface-variant);border-bottom:2px solid transparent;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--on-surface);border-bottom-color:var(--on-surface)}
.qp-d{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;border-radius:var(--radius-sm);text-align:left;width:100%}
.qp-d:hover{background:var(--surface-2)} .qp-d.cur{background:var(--primary-container);color:var(--on-primary-container)}
.qp-d b{font-weight:600;font-size:13px} .qp-d small{font-size:11.5px;color:var(--on-surface-variant)}
.qp-c{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--outline-variant);flex-wrap:wrap}
.qp-c input{height:30px;border:1px solid var(--outline);border-radius:var(--radius-sm);padding:0 6px;background:var(--surface);color:var(--on-surface)}
.af{display:flex;flex-direction:column;gap:14px}
.af fieldset{border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 14px}
.af legend{font-size:12px;font-weight:700;color:var(--on-surface-variant);padding:0 4px}
.af label{display:flex;align-items:center;gap:6px;font-size:13px}
.star.on .ms{font-variation-settings:'FILL' 1;color:#eda100}
.rc-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:6px;color:var(--on-surface-variant);font-size:13px;padding:20px 0}
.rc-empty .ms{font-size:30px;max-width:none}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>
  <main class="main"><div class="frame">
    <div class="dh">
      <button class="btn btn--text btn--icon star" id="favBtn" aria-label="Yêu thích" aria-pressed="false"><span class="ms">star</span></button>
      <div><button class="dsel" id="dBtn" aria-haspopup="menu"><h1 id="dName"></h1><span class="ms">arrow_drop_down</span></button></div>
      <div class="r"><button class="btn btn--text sm" data-toast="Khám phá báo cáo: thư viện báo cáo mẫu của HubSpot (ngoài phạm vi)">Khám phá báo cáo</button>
        <button class="btn btn--secondary" data-toast="Tạo dashboard mới từ mẫu hoặc trống (ngoài phạm vi giai đoạn 2)">Tạo dashboard</button>
        <button class="btn btn--secondary" id="actBtn">Thao tác<span class="ms xs">arrow_drop_down</span></button>
        <button class="btn btn--secondary" id="shareBtn">Chia sẻ<span class="ms xs">arrow_drop_down</span></button>
        <button class="btn btn--primary" id="addBtn">Thêm nội dung<span class="ms xs">arrow_drop_down</span></button>
        <button class="btn btn--secondary btn--icon" data-toast="Cài đặt dashboard: quyền truy cập, múi giờ hiển thị" aria-label="Cài đặt dashboard"><span class="ms sm">settings</span></button></div>
    </div>
    <div class="fl" id="fl"></div>
    <div class="dg viz" id="grid"></div>
    <div class="pop" id="pop"></div>
    <p class="nil" style="text-align:right;font-size:12px;padding:0 20px 18px">Theo giờ Việt Nam (UTC+07:00)</p>
  </div></main>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"></aside>
<div class="modal-bg" id="modal"></div>
<div class="demo" id="demo" role="group" aria-label="Điều khiển mockup"></div>
<div class="toast" id="toast" role="status"></div>
<script src="crm-shared.js"></script>
<script src="crm-objects.js"></script>
<script>
const {esc, toast, $} = HX;
HX.shell('reports');
const TODAY = HXC.TODAY, STAGE = HXC.STAGE, CASH = HXC.CASH, CLOSE = HXC.CLOSE, SALE = HXC.SALE;
const DASH = { crm:'CRM Data Overview', pipe:'Pipeline Overview' };
/* Trạng thái lưu theo trình duyệt: yêu thích, thứ tự / kích thước / tên / báo cáo đã gỡ của từng dashboard */
const SK = 'hx-crm-dash-v1';
let S = {}; try { S = JSON.parse(localStorage.getItem(SK) || '{}'); } catch {}
S.fav = S.fav || {}; S.recent = S.recent || [];
const save = () => { try { localStorage.setItem(SK, JSON.stringify(S)); } catch {} };
const D0 = k => (S[k] = S[k] || { order:null, size:{}, names:{}, hidden:[] });
const st = { dash: new URLSearchParams(location.search).get('d') === 'pipe' ? 'pipe' : 'crm',
  f:{ crm:{ range:'month', owners:[], quick:['owner','range'] }, pipe:{ range:'quarter', owners:[], quick:['range','owner'] } }, adv:{ lifecycle:[], goi:[] } };
const F = () => st.f[st.dash];

/* ── Khoảng thời gian (preset như HubSpot) ── */
const DATE_P = [['today','Hôm nay'],['yesterday','Hôm qua'],['week','Tuần này'],['lastweek','Tuần trước'],['month','Cả tháng này'],['lastmonth','Tháng trước'],['quarter','Cả quý này'],['lastquarter','Quý trước'],['year','Cả năm nay'],['lastyear','Năm trước'],['d7','7 ngày qua'],['d30','30 ngày qua'],['d90','90 ngày qua'],['all','Mọi thời gian']];
const fmtD = d => `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
function range(key = F().range) {
  const y = TODAY.getFullYear(), m = TODAY.getMonth(), d0 = new Date(y, m, TODAY.getDate()), day = 864e5, wd = (d0.getDay() + 6) % 7, q = Math.floor(m / 3) * 3;
  if (typeof key === 'object') return [new Date(key.from + 'T00:00:00'), new Date(new Date(key.to + 'T00:00:00').getTime() + day), `${fmtD(new Date(key.from))} – ${fmtD(new Date(key.to))}`];
  const R = { today:[d0, new Date(+d0 + day)], yesterday:[new Date(+d0 - day), d0], week:[new Date(+d0 - wd * day), new Date(+d0 + (7 - wd) * day)], lastweek:[new Date(+d0 - (wd + 7) * day), new Date(+d0 - wd * day)],
    month:[new Date(y, m, 1), new Date(y, m + 1, 1)], lastmonth:[new Date(y, m - 1, 1), new Date(y, m, 1)], quarter:[new Date(y, q, 1), new Date(y, q + 3, 1)], lastquarter:[new Date(y, q - 3, 1), new Date(y, q, 1)],
    year:[new Date(y, 0, 1), new Date(y + 1, 0, 1)], lastyear:[new Date(y - 1, 0, 1), new Date(y, 0, 1)], d7:[new Date(+d0 - 6 * day), new Date(+d0 + day)], d30:[new Date(+d0 - 29 * day), new Date(+d0 + day)], d90:[new Date(+d0 - 89 * day), new Date(+d0 + day)],
    all:[new Date(2026, 0, 1), new Date(2100, 0, 1)] }[key];
  return [...R, DATE_P.find(p => p[0] === key)[1]];
}
function prevRange() { const [a, b] = range(); const len = b - a; return [new Date(a.getTime() - len), a]; }
const rangeTip = () => { const [a, b] = range(); return F().range === 'all' ? 'Mọi thời gian' : `Khoảng thời gian: ${fmtD(a)} – ${fmtD(new Date(b - 864e5))}`; };
const inR = (iso, [a, b]) => iso && new Date(iso) >= a && new Date(iso) < b;
const ownerOK = v => !F().owners.length || F().owners.includes(v);
// Các tháng nằm trong khoảng lọc (biểu đồ "theo thời gian", tần suất tháng như HubSpot)
function monthsIn() { let [a, b] = range(); if (F().range === 'all') { a = new Date(2026, 6, 1); b = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 1); }
  const out = []; let d = new Date(a.getFullYear(), a.getMonth(), 1);
  while (d < b && out.length < 12) { const n = new Date(d.getFullYear(), d.getMonth() + 1, 1); out.push([new Date(Math.max(d, a)), new Date(Math.min(n, b)), `T${d.getMonth() + 1}/${d.getFullYear()}`]); d = n; }
  return out; }

/* ── Dữ liệu cho drill-down / xuất CSV ── */
const DRILL = {}; let dn = 0;
const drill = (title, rows) => { const k = 'd' + (++dn); DRILL[k] = { title, rows }; return k; };
const rowC = c => ({ href: HXC.url('contact', c.id), name: HXC.fullName(c), sub: HXC.dOnly(c.createdAt), cols:{ 'Tên': HXC.fullName(c), 'Email': c.values.email || '', 'Owner': c.values.owner || '', 'Nguồn': c.values.source || '', 'Lifecycle': c.values.lifecycle || '', 'Ngày tạo': HXC.dOnly(c.createdAt) } });
const rowD = d => ({ href: HXC.url('deal', d.id), name: `${HX.title(d)} · ${d.values.t_n_deal || ''}`, sub: HX.F[CASH] ? (HX.fmt(d.values[CASH], HX.F[CASH]) || '—') : '',
  cols:{ 'Mã Deal': HX.title(d), 'Tên Deal': d.values.t_n_deal || '', 'Giai đoạn': d.values[STAGE] || '', 'Amount': d.values[CASH] ?? '', 'Ngày chốt': d.values[CLOSE] || '', 'Sale phụ trách': d.values[SALE] || '', 'Ngày tạo': HXC.dOnly(d.createdAt) } });
const rowA = a => { const t = a.deals && a.deals[0] ? ['deal', a.deals[0]] : a.contacts && a.contacts[0] ? ['contact', a.contacts[0]] : ['company', (a.companies || [])[0]];
  return { href: HXC.url(t[0], t[1]), name: `${a.title || a.body || ''}`.slice(0, 70), sub: `${a.by} · ${HXC.dOnly(a.at)}`, cols:{ 'Loại': a.type, 'Nội dung': a.title || a.body || '', 'Người thực hiện': a.by, 'Thời điểm': HXC.dt(a.at) } }; };

/* ── Biểu đồ (mark mảnh, đầu bo 4px, lưới nhạt; 1 series = 1 màu; nhiều hạng mục = bảng categorical đã kiểm + nhãn trực tiếp) ── */
const CAT = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
const nf = v => Number(v).toLocaleString('vi-VN');
const money = v => { v = Number(v) || 0; return v >= 1e9 ? (v / 1e9).toLocaleString('vi-VN', {maximumFractionDigits:2}) + ' tỷ' : v >= 1e6 ? (v / 1e6).toLocaleString('vi-VN', {maximumFractionDigits:1}) + ' tr' : nf(v); };
const nice = m => { if (m <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); const n = m / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
function hbar(rows, { fmt = nf, color = 'var(--series-1)', title } = {}) {
  const mx = Math.max(1, ...rows.map(r => r.value));
  return `<div class="hb" role="img" aria-label="${esc(title || '')}">${rows.map(r => `<div class="hb-r" data-tip="${esc(r.label)}: ${esc(fmt(r.value))}" ${r.drill ? `data-drill="${r.drill}"` : ''}>
    <span class="hb-l" title="${esc(r.label)}">${esc(r.label)}</span>${(w => `<span class="hb-t"><i style="width:${w}%;background:${r.color || color}"></i><b style="left:calc(${w}% + 6px)">${esc(fmt(r.value))}</b></span>`)(r.value ? Math.max(1.5, r.value / mx * 100) : 0)}</div>`).join('')}</div>`;
}
const CH = {}; let cn = 0;
const vcol = (rows, opts = {}) => { const k = 'c' + (++cn); CH[k] = [rows, opts]; return `<div class="ch-host" data-chart="${k}" style="min-height:204px"></div>`; };
function drawCharts() { document.querySelectorAll('.ch-host').forEach(h => { const [rows, o] = CH[h.dataset.chart]; h.innerHTML = vcolSvg(rows, o, Math.max(260, h.clientWidth)); }); }
function vcolSvg(rows, { fmt = nf, title, line = false } = {}, W = 480) {
  const H = 200, l = 44, b = 170, t = 14, pw = W - l - 10, mx = nice(Math.max(1, ...rows.map(r => r.value))), step = pw / Math.max(1, rows.length);
  const ticks = [0, .5, 1].map(f => f * mx), Y = v => b - v / mx * (b - t);
  const grid = ticks.map(v => `<line x1="${l}" x2="${W - 10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-2)">${esc(fmt(v))}</text>`).join('');
  const labels = rows.map((r, i) => `<text x="${l + step * i + step / 2}" y="${b + 18}" text-anchor="middle" font-size="11.5" fill="var(--ink-2)">${esc(r.label)}</text>`).join('');
  if (line) { const pts = rows.map((r, i) => [l + step * i + step / 2, Y(r.value)]);
    return `<svg viewBox="0 0 ${W} ${H + 4}" role="img" aria-label="${esc(title || '')}">${grid}${labels}${pts.length > 1 ? `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join('')}" fill="none" stroke="var(--series-1)" stroke-width="2"/>` : ''}

$('#grid').addEventListener('mousedown', e => { const g = e.target.closest('[data-grip]'); const c = e.target.closest('.rc'); if (c) c.draggable = !!g; });
$('#grid').addEventListener('dragstart', e => { const c = e.target.closest('.rc'); if (!c || !c.draggable) return; dragId = c.dataset.rid; c.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragId); });
$('#grid').addEventListener('dragover', e => { const c = e.target.closest('.rc[data-rid]'); if (c && dragId) { e.preventDefault(); document.querySelectorAll('.dropt').forEach(x => x.classList.remove('dropt')); if (c.dataset.rid !== dragId) c.classList.add('dropt'); } });
$('#grid').addEventListener('drop', e => { const c = e.target.closest('.rc[data-rid]'); if (!c || !dragId) return; e.preventDefault();
  const d = D0(st.dash), ord = reportsOf(st.dash).map(r => r.id).filter(x => x !== dragId); ord.splice(ord.indexOf(c.dataset.rid), 0, dragId); d.order = [...ord, ...d.hidden]; save(); dragId = null; render(); toast('Đã sắp xếp lại báo cáo'); });
$('#grid').addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.dropt').forEach(x => x.classList.remove('dragging', 'dropt')); });

document.addEventListener('click', e => {
  const t = e.target;
  const dr = t.closest('[data-drill]'); if (dr && t.closest('#grid')) { openDrill(dr.dataset.drill); return; }
  const tt = t.closest('[data-toast]'); if (tt) { toast(tt.dataset.toast); closePop(); return; }
  // Bộ chọn dashboard: Tất cả · Xem gần đây · Yêu thích · Dashboard của tôi + tìm
  if (t.closest('#dBtn')) { e.stopPropagation(); let tab = 'all', q = '';
    const draw = () => { const ids = tab === 'recent' ? S.recent.filter(k => DASH[k]) : tab === 'fav' ? Object.keys(DASH).filter(k => S.fav[k]) : Object.keys(DASH);
      pop.querySelector('#dL').innerHTML = ids.filter(k => DASH[k].toLowerCase().includes(q)).map(k => `<button class="mi" data-dash="${k}" ${k === st.dash ? 'style="font-weight:700"' : ''}>${S.fav[k] ? '<span class="ms sm" style="color:#eda100;font-variation-settings:\'FILL\' 1">star</span>' : '<span class="ms sm">dashboard</span>'}${DASH[k]}</button>`).join('') || '<div class="nil" style="padding:10px;font-size:13px">Không có dashboard</div>'; };
    openPop(t.closest('#dBtn'), `<div class="dtabs" role="tablist">${[['all','Tất cả'],['recent','Xem gần đây'],['fav','Yêu thích'],['mine','Của tôi']].map(([k, l]) => `<button role="tab" data-dt="${k}" aria-selected="${k === 'all'}">${l}</button>`).join('')}</div>
      <label class="srch2" style="height:34px;margin-bottom:6px"><input id="dQ" placeholder="Tìm dashboard"><span class="ms sm">search</span></label><div id="dL"></div>`, 420);
    draw(); pop.querySelector('#dQ').focus(); pop.querySelector('#dQ').oninput = ev => { q = ev.target.value.trim().toLowerCase(); draw(); };
    pop.onclick = ev => { ev.stopPropagation(); const b = ev.target.closest('[data-dt]'); if (b) { tab = b.dataset.dt; pop.querySelectorAll('[data-dt]').forEach(x => x.setAttribute('aria-selected', x === b)); draw(); }
      const dd = ev.target.closest('[data-dash]'); if (dd) { st.dash = dd.dataset.dash; history.replaceState(null, '', '?d=' + st.dash); closePop(); render(); } }; return; }
  if (t.closest('#favBtn')) { S.fav[st.dash] = !S.fav[st.dash]; save(); render(); toast(S.fav[st.dash] ? 'Đã thêm vào Yêu thích' : 'Đã bỏ khỏi Yêu thích'); return; }
  if (t.closest('#actBtn')) { e.stopPropagation(); openPop(t.closest('#actBtn'), `<button class="mi" data-drn><span class="ms sm">edit</span>Đổi tên dashboard</button><button class="mi" data-toast="Nhân bản dashboard (ngoài phạm vi giai đoạn 2)"><span class="ms sm">content_copy</span>Nhân bản</button>
      <button class="mi" data-toast="Đặt làm dashboard mặc định khi mở mục Báo cáo"><span class="ms sm">home</span>Đặt làm mặc định</button><button class="mi" data-dcsv><span class="ms sm">download</span>Xuất dữ liệu (CSV)</button>
      <button class="mi" data-toast="Gửi dashboard qua email theo lịch — cần dịch vụ email của ERP"><span class="ms sm">schedule_send</span>Gửi email định kỳ</button><div class="sep"></div><button class="mi" data-dreset><span class="ms sm">restart_alt</span>Khôi phục bố cục mặc định</button>`, 260, true); return; }
  if (t.closest('[data-drn]')) { closePop(); HX.modal(`<div class="modal" role="dialog" aria-modal="true" style="width:min(420px,100%)"><div class="mh">Đổi tên dashboard<button class="btn btn--text btn--icon x" data-close aria-label="Đóng"><span class="ms">close</span></button></div><div class="mb field-form"><label>Tên<input class="in" id="dnIn" value="${esc(DASH[st.dash])}"></label></div><div class="mf"><button class="btn btn--secondary" data-close>Huỷ</button><button class="btn btn--primary" id="dnOk">Lưu</button></div></div>`, (bg, close) => { bg.querySelector('#dnOk').onclick = () => { const v = bg.querySelector('#dnIn').value.trim(); if (v) { DASH[st.dash] = v; D0(st.dash).title = v; save(); } close(); render(); }; }); return; }
  if (t.closest('[data-dcsv]')) { closePop(); const rows = reportsOf(st.dash).flatMap(r => (DRILL[r._k] || { rows:[] }).rows); const k = drill(DASH[st.dash], [...new Map(rows.map(r => [r.href + r.name, r])).values()]); csv(k, DASH[st.dash]); return; }
  if (t.closest('[data-dreset]')) { closePop(); S[st.dash] = { order:null, size:{}, names:{}, hidden:[] }; save(); render(); toast('Đã khôi phục bố cục mặc định'); return; }
  if (t.closest('#shareBtn')) { e.stopPropagation(); openPop(t.closest('#shareBtn'), `<button class="mi" data-copyl><span class="ms sm">link</span>Sao chép liên kết</button><button class="mi" data-toast="Gửi qua email — cần dịch vụ email của ERP"><span class="ms sm">mail</span>Gửi qua email</button><button class="mi" data-toast="Chia sẻ với người dùng / nhóm trong ERP (phân quyền dashboard)"><span class="ms sm">group</span>Quản lý quyền truy cập</button>`, 240, true); return; }
  if (t.closest('[data-copyl]')) { closePop(); navigator.clipboard?.writeText(location.href).catch(() => {}); toast('Đã sao chép liên kết dashboard'); return; }
  if (t.closest('#addBtn')) { e.stopPropagation(); const hid = D0(st.dash).hidden.map(id => REPORTS[st.dash].find(r => r.id === id)).filter(Boolean);
    openPop(t.closest('#addBtn'), `<div class="hd">Báo cáo đã gỡ khỏi dashboard</div>${hid.map(r => `<button class="mi" data-radd="${r.id}"><span class="ms sm">add_chart</span>${esc(r.title)}</button>`).join('') || '<div class="nil" style="padding:6px 10px;font-size:13px">Không có — mọi báo cáo đang hiển thị</div>'}
      <div class="sep"></div><button class="mi" data-toast="Tạo báo cáo mới bằng Report Builder (ngoài phạm vi giai đoạn 2)"><span class="ms sm">bar_chart</span>Tạo báo cáo mới</button><button class="mi" data-toast="Thêm văn bản / hình ảnh vào dashboard (ngoài phạm vi)"><span class="ms sm">text_fields</span>Văn bản & hình ảnh</button>`, 300, true); return; }
  const ra = t.closest('[data-radd]'); if (ra) { const d = D0(st.dash); d.hidden = d.hidden.filter(x => x !== ra.dataset.radd); save(); closePop(); render(); toast('Đã thêm lại báo cáo'); return; }
  // Bộ lọc nhanh
  if (t.closest('#qEdit')) { e.stopPropagation(); const f = F();
    openPop(t.closest('#qEdit'), `<div class="hd">Bộ lọc nhanh hiển thị</div>${[['range','Khoảng thời gian'],['owner', st.dash === 'pipe' ? 'Deal owner' : 'Owners']].map(([k, l]) => `<label class="mi"><input type="checkbox" data-qk="${k}" ${f.quick.includes(k) ? 'checked' : ''}>${l}</label>`).join('')}`, 240);
    pop.onclick = ev => ev.stopPropagation(); pop.onchange = ev => { const k = ev.target.dataset.qk; f.quick = ev.target.checked ? [...f.quick, k] : f.quick.filter(x => x !== k); if (!ev.target.checked) { if (k === 'owner') f.owners = []; if (k === 'range') f.range = st.dash === 'pipe' ? 'quarter' : 'month'; } render(); }; return; }
  const q = t.closest('[data-q]'); if (q) { e.stopPropagation(); const f = F();
    if (q.dataset.q === 'range') { const cur = f.range;
      openPop(q, `<div style="display:flex;flex-direction:column">${DATE_P.map(([v, l]) => `<button class="qp-d ${cur === v ? 'cur' : ''}" data-rg="${v}"><b>${l}</b><small>${v === 'all' ? 'Không giới hạn' : (([a, b]) => `${fmtD(a)} – ${fmtD(new Date(b - 864e5))}`)(range(v))}</small></button>`).join('')}</div>
        <div class="qp-c"><b style="font-size:12.5px;width:100%">Tuỳ chọn</b><input type="date" id="rgA" value="${typeof cur === 'object' ? cur.from : ''}"> – <input type="date" id="rgB" value="${typeof cur === 'object' ? cur.to : ''}"><button class="btn btn--primary sm" id="rgOk">Áp dụng</button></div>`, 300);
      pop.onclick = ev => { ev.stopPropagation(); const b = ev.target.closest('[data-rg]'); if (b) { f.range = b.dataset.rg; closePop(); render(); }
        if (ev.target.closest('#rgOk')) { const a = pop.querySelector('#rgA').value, bb = pop.querySelector('#rgB').value; if (!a || !bb || a > bb) { toast('Chọn ngày bắt đầu ≤ ngày kết thúc'); return; } f.range = { from:a, to:bb }; closePop(); render(); } }; return; }
    const sel = new Set(f.owners);
    openPop(q, `<label class="srch2" style="height:32px;margin-bottom:6px"><input id="oQ" placeholder="Tìm"><span class="ms sm">search</span></label><div id="oL"></div><div class="qp-c" style="justify-content:space-between"><button class="lk" id="oClr" style="font-weight:600;font-size:12.5px">Bỏ chọn</button><button class="btn btn--primary sm" id="oOk">Áp dụng</button></div>`, 260);
    const drawO = (qq = '') => { pop.querySelector('#oL').innerHTML = HX.USERS.filter(u => u.toLowerCase().includes(qq)).map(u => `<label class="mi"><input type="checkbox" value="${esc(u)}" ${sel.has(u) ? 'checked' : ''}>${esc(u)}${u === HXC.ME ? ' (tôi)' : ''}</label>`).join(''); };
    drawO(); pop.querySelector('#oQ').oninput = ev => drawO(ev.target.value.trim().toLowerCase());
    pop.onchange = ev => { if (ev.target.type === 'checkbox') ev.target.checked ? sel.add(ev.target.value) : sel.delete(ev.target.value); };
    pop.onclick = ev => { ev.stopPropagation(); if (ev.target.closest('#oOk')) { f.owners = [...sel]; closePop(); render(); } if (ev.target.closest('#oClr')) { f.owners = []; closePop(); render(); } }; return; }
  if (t.closest('#advBtn')) { const p = $('#panel');
    p.innerHTML = `<div class="pn-h"><h2>Bộ lọc nâng cao</h2><button class="btn btn--text btn--icon" data-pclose aria-label="Đóng"><span class="ms">close</span></button></div>
      <div class="pn-b af"><p class="nil" style="font-size:13px">Áp dụng cho mọi báo cáo trên dashboard (VÀ với bộ lọc nhanh).</p>
        <fieldset><legend>Contact · Lifecycle stage</legend>${HXC.LIFECYCLE.map(l => `<label><input type="checkbox" data-al="lifecycle" value="${esc(l)}" ${st.adv.lifecycle.includes(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}</fieldset>
        <fieldset><legend>Deal · Gói dịch vụ mục tiêu</legend>${(HX.F.g_i_d_ch_v_m_c_ti_u ? HX.F.g_i_d_ch_v_m_c_ti_u.choices : []).map(l => `<label><input type="checkbox" data-al="goi" value="${esc(l)}" ${st.adv.goi.includes(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}</fieldset></div>
      <div class="pn-f"><button class="btn btn--primary" id="afOk">Áp dụng</button><button class="btn btn--secondary" data-pclose>Huỷ</button><button class="btn btn--text" id="afClr" style="margin-left:auto">Xoá tất cả</button></div>`;
    p.onclick = ev => { if (ev.target.closest('[data-pclose]')) HX.closePanel();
      if (ev.target.closest('#afClr')) p.querySelectorAll('[data-al]').forEach(i => i.checked = false);
      if (ev.target.closest('#afOk')) { st.adv = { lifecycle:[], goi:[] }; p.querySelectorAll('[data-al]:checked').forEach(i => st.adv[i.dataset.al].push(i.value)); HX.closePanel(); render(); } };
    document.body.classList.remove('dock'); p.classList.add('open'); document.body.classList.add('panel-open'); return; }
  if (t.closest('#fClr')) { const f = F(); f.owners = []; f.range = st.dash === 'pipe' ? 'quarter' : 'month'; st.adv = { lifecycle:[], goi:[] }; render(); return; }
  if (t.closest('#refresh')) { render(); toast('Đã làm mới dữ liệu'); return; }
  // Thanh công cụ trên thẻ báo cáo
  const rr = t.closest('[data-rrf]'); if (rr) { render(); toast('Đã làm mới báo cáo'); return; }
  const rf = t.closest('[data-rfl]'); if (rf) { e.stopPropagation(); const r = REPORTS[st.dash].find(x => x.id === rf.dataset.rfl);
    openPop(rf, `<div class="hd">Bộ lọc của báo cáo</div><div style="padding:4px 10px 8px;font-size:13px;display:flex;flex-direction:column;gap:6px"><span>• ${esc(rangeTip())}${r.freq ? ' · theo tháng' : ''}</span>${F().owners.length ? `<span>• Owner: ${esc(F().owners.join(', '))}</span>` : ''}${r.filt ? `<span>• ${r.id === 'dcl' ? 'Giai đoạn là Closed Won hoặc Closed Lost' : 'Giai đoạn là Closed Won'}</span>` : ''}${st.adv.lifecycle.length ? `<span>• Lifecycle: ${esc(st.adv.lifecycle.join(', '))}</span>` : ''}${st.adv.goi.length ? `<span>• Gói: ${esc(st.adv.goi.join(', '))}</span>` : ''}</div>`, 280, true); return; }
  const rm = t.closest('[data-rm]'); if (rm) { e.stopPropagation(); const r = REPORTS[st.dash].find(x => x.id === rm.dataset.rm);
    openPop(rm, `${r.list ? `<a class="mi" href="${r.list}"><span class="ms sm">open_in_new</span>Đi tới ${r.list.includes('contacts') ? 'Contacts' : 'Deals'}</a>` : ''}<button class="mi" data-rview="${r.id}"><span class="ms sm">list</span>Xem bản ghi</button>
      <button class="mi" data-toast="Sửa trong Report Builder (ngoài phạm vi giai đoạn 2)"><span class="ms sm">edit_note</span>Sửa trong Report Builder</button><button class="mi" data-rrn="${r.id}"><span class="ms sm">edit</span>Đổi tên</button>
      <button class="mi" data-rcsv="${r.id}"><span class="ms sm">download</span>Xuất dữ liệu chi tiết (CSV)</button><button class="mi" data-toast="Chia sẻ báo cáo qua liên kết / email"><span class="ms sm">share</span>Chia sẻ</button>
      <button class="mi" data-rmv="${r.id}"><span class="ms sm">swap_horiz</span>Chuyển sang ${st.dash === 'crm' ? 'Pipeline Overview' : 'CRM Data Overview'}</button><div class="sep"></div>
      <button class="mi" data-rhide="${r.id}" style="color:var(--error)"><span class="ms sm">remove_circle</span>Gỡ khỏi dashboard</button>`, 280, true); return; }
  const rv = t.closest('[data-rview]'); if (rv) { closePop(); const r = REPORTS[st.dash].find(x => x.id === rv.dataset.rview); openDrill(r._k, D0(st.dash).names[r.id] || r.title); return; }
  const rc = t.closest('[data-rcsv]'); if (rc) { closePop(); const r = REPORTS[st.dash].find(x => x.id === rc.dataset.rcsv); csv(r._k, D0(st.dash).names[r.id] || r.title); return; }
  const rn = t.closest('[data-rrn]'); if (rn) { closePop(); const r = REPORTS[st.dash].find(x => x.id === rn.dataset.rrn), d = D0(st.dash);
    HX.modal(`<div class="modal" role="dialog" aria-modal="true" style="width:min(420px,100%)"><div class="mh">Đổi tên báo cáo<button class="btn btn--text btn--icon x" data-close aria-label="Đóng"><span class="ms">close</span></button></div><div class="mb field-form"><label>Tên<input class="in" id="rnIn" value="${esc(d.names[r.id] || r.title)}"></label></div><div class="mf"><button class="btn btn--secondary" data-close>Huỷ</button><button class="btn btn--primary" id="rnOk">Lưu</button></div></div>`,
      (bg, close) => { bg.querySelector('#rnOk').onclick = () => { const v = bg.querySelector('#rnIn').value.trim(); if (v) d.names[r.id] = v; save(); close(); render(); toast('Đã đổi tên báo cáo'); }; }); return; }
  const mv = t.closest('[data-rmv]'); if (mv) { closePop(); toast('Mỗi báo cáo dùng dữ liệu riêng của dashboard — chuyển dashboard cần Report Builder (ngoài phạm vi)'); return; }
  const rh = t.closest('[data-rhide]'); if (rh) { closePop(); const d = D0(st.dash); d.hidden.push(rh.dataset.rhide); save(); render(); toast('Đã gỡ báo cáo — thêm lại ở “Thêm nội dung”'); return; }
  const rs = t.closest('[data-rsz]'); if (rs) { const r = REPORTS[st.dash].find(x => x.id === rs.dataset.rsz), d = D0(st.dash); d.size[r.id] = ((d.size[r.id] || r.size) % 3) + 1; save(); render(); return; }
  if (!t.closest('#pop')) closePop();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
Object.keys(DASH).forEach(k => { if (S[k] && S[k].title) DASH[k] = S[k].title; });
render();
</script>
</body>
</html>
