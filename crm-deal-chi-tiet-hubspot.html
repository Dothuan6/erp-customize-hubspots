<!DOCTYPE html>
<html lang="vi" data-brand="crm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết bản ghi — Deals_Pipeline (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="crm-shared.css">
<style>
/* ═══ Trang đầy đủ của 1 bản ghi (/data/:id/records/:recordId) ═══
   Chức năng ERP: breadcrumb · Kích hoạt Workflow · sửa từng trường tại chỗ ·
   Lịch sử / Liên kết (ERP đang "sắp ra mắt"). Bố cục: record page 3 cột HubSpot. */
.frame.rec{overflow:auto;background:var(--page-bg)}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:12px;align-items:start}
@media(min-width:905px){ .grid{grid-template-columns:320px 1fr} .col-r{grid-column:1/-1} }
@media(min-width:1240px){ .grid{grid-template-columns:320px minmax(0,1fr) 300px} .col-r{grid-column:auto} }
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
@media(min-width:905px){ .col-l{position:sticky;top:0} }
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg)}
.ch{display:flex;align-items:center;gap:6px;padding:12px 14px;font-weight:600}
.ch .r{margin-left:auto;display:flex;gap:2px;position:relative}
.cb{padding:0 14px 14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 8px;position:relative}
.crumb{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--on-surface-variant);min-width:0;flex-wrap:wrap}
.crumb a{color:var(--link);font-weight:600}
.crumb a:hover{text-decoration:underline}
.idt{display:flex;gap:12px;align-items:flex-start;padding:10px 14px 4px}
.idt .ic{width:44px;height:44px;border-radius:var(--radius-md);background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;flex:none}
.idt .ic .ms{font-size:24px;max-width:none}
.idt h1{font-size:20px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.idt .sub{font-size:13px;color:var(--on-surface-variant)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;padding:8px 14px 12px;align-items:center}
.kv dt{color:var(--on-surface-variant)} .kv dd{font-weight:600;min-width:0}
.acts{padding:0 14px 14px}
.acts .btn{width:100%}
.more-props{margin-top:4px}
.props.short .prop:nth-child(n+7){display:none}

.tabs{display:flex;border-bottom:1px solid var(--outline-variant)}
.tab{flex:1;height:44px;font-weight:600;color:var(--on-surface-variant);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--on-surface);border-bottom-color:var(--primary)}
.pane{display:none;padding:14px;flex-direction:column;gap:14px}
.pane.on{display:flex}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hl .it{border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:10px 12px;cursor:text}
.hl .it:hover{background:var(--surface-variant)}
.hl .k{font-size:12px;color:var(--on-surface-variant)}
.hl .val{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.sec h3{font-size:14px;font-weight:700;margin-bottom:6px}
.twocol{display:grid;grid-template-columns:1fr;gap:0 24px}
@media(min-width:760px){.twocol{grid-template-columns:1fr 1fr}}
.rel{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--outline-variant);border-radius:var(--radius-md)}
.rel .lnk{font-weight:600;color:var(--link)}
.rel small{display:block;font-size:12px;color:var(--on-surface-variant)}
.meta{font-size:12px;color:var(--on-surface-variant);padding:0 14px 14px;display:flex;flex-direction:column;gap:2px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>
  <main class="main"><div class="frame rec">
    <div class="grid" id="grid">
      <!-- CỘT TRÁI -->
      <div class="col col-l">
        <section class="card">
          <div class="top">
            <nav class="crumb" aria-label="Breadcrumb"><a href="crm-giao-dich-hubspot.html" id="toList" style="display:inline-flex;align-items:center"><span class="ms sm">chevron_left</span>Deals</a><span class="nil" id="toData" title="Collection gốc trên ERP">· Deals_Pipeline</span></nav>
            <div style="position:relative">
              <button class="btn btn--text sm" id="actBtn" aria-haspopup="menu">Thao tác<span class="ms xs">arrow_drop_down</span></button>
              <div class="pop" id="actPop" role="menu" style="right:0;top:32px">
                <button class="mi" role="menuitem" data-wf><span class="ms sm">account_tree</span>Kích hoạt Workflow</button>
                <button class="mi" role="menuitem" data-cols><span class="ms sm">settings</span>Quản lý cột dữ liệu</button>
              </div>
            </div>
          </div>
          <div class="idt"><span class="ic"><span class="ms">handshake</span></span><div style="min-width:0"><h1 id="ttl"></h1><div class="sub" id="sub"></div></div></div>
          <dl class="kv" id="kv"></dl>
          <div class="acts"><button class="btn btn--secondary" data-wf><span class="ms sm">bolt</span>Kích hoạt Workflow</button></div>
        </section>
        <section class="card">
          <div class="ch"><span class="ms sm">expand_more</span>Thông tin bản ghi
            <span class="r"><button class="btn btn--text btn--icon" data-cols title="Quản lý cột dữ liệu" aria-label="Quản lý cột dữ liệu"><span class="ms sm">settings</span></button></span></div>
          <div class="cb"><div class="props short" id="leftProps"></div>
            <button class="btn btn--text sm more-props" id="moreProps">Xem tất cả thuộc tính</button></div>
          <div class="meta" id="meta"></div>
        </section>
      </div>

      <!-- CỘT GIỮA -->
      <div class="col">
        <section class="card">
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-pane="ov">Tổng quan</button>
            <button class="tab" role="tab" aria-selected="false" data-pane="hist">Lịch sử</button>
          </div>
          <div class="pane on" id="pane-ov">
            <div class="hl" id="hl"></div>
            <div class="sec"><h3>Giá trị & chi phí</h3><div class="props twocol" id="pMoney"></div></div>
            <div class="sec"><h3>Gói & thanh toán</h3><div class="props twocol" id="pPkg"></div></div>
            <div class="sec"><h3>Kết quả</h3><div class="props twocol" id="pResult"></div></div>
          </div>
          <div class="pane" id="pane-hist"><div class="soon"><span class="ms">history</span>Lịch sử thay đổi (sắp ra mắt)</div></div>
        </section>
      </div>

      <!-- CỘT PHẢI -->
      <div class="col col-r">
        <section class="card">
          <div class="ch"><span class="ms sm">expand_more</span>Test <span style="color:var(--on-surface-variant);font-weight:500" id="relCount"></span>
            <span class="r"><button class="btn btn--text sm" id="relEdit"><span class="ms xs">add</span>Chọn</button></span></div>
          <div class="cb" id="relBox"></div>
        </section>
        <section class="card">
          <div class="ch"><span class="ms sm">expand_more</span>Liên kết</div>
          <div class="soon" style="padding-top:8px"><span class="ms">link</span>Liên kết (sắp ra mắt)</div>
        </section>
      </div>
    </div>
  </div></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"></aside>
<div class="modal-bg" id="modal"></div>
<div class="demo" id="demo" role="group" aria-label="Điều khiển mockup"></div>
<div class="toast" id="toast" role="status"></div>

<script src="crm-shared.js"></script>
<script>
const {FIELDS,F,api,esc,empty,fmt,display,createdFmt,title,editor,toast,$} = HX;
HX.shell();
const id = new URLSearchParams(location.search).get('id') || api.list()[0]?.id;
const r = api.get(id);
if (!r) { document.getElementById('grid').innerHTML = '<div class="card soon" style="grid-column:1/-1"><span class="ms">search_off</span>Bản ghi không tìm thấy.<a class="btn btn--secondary" href="crm-giao-dich-hubspot.html">Về Deals_Pipeline</a></div>'; }
else {
  const HL = ['t_ng_cash_in_d_ki_n','ng_y_d_ki_n_ch_t','giai_o_n_pipeline','t_l_th_nh_c_ng'];
  function render(){
    document.title = `${title(r)} — Deals_Pipeline`;
        $('#ttl').textContent = title(r);
    $('#sub').textContent = r.values.t_n_deal || '';
    $('#kv').innerHTML = [['giai_o_n_pipeline'],['t_ng_cash_in_d_ki_n'],['ng_y_d_ki_n_ch_t'],['sale_ph_tr_ch']].map(([k]) => `<dt>${esc(F[k].name)}</dt><dd>${display(r.values[k], F[k])}</dd>`).join('');
    HX.propList($('#leftProps'), r, 'page');
    $('#meta').innerHTML = `<span>Ngày tạo: ${createdFmt(r.createdAt)}</span>`;
    $('#hl').innerHTML = HL.map(k => `<div class="it" data-hl="${k}"><div class="k">${esc(F[k].name)}</div><div class="val">${display(r.values[k], F[k])}</div></div>`).join('');
    HX.propList($('#pMoney'), r, 'page', ['ph_thu_tr_tr_c','ph_kh_i_t_o_setup','t_ng_cash_in_d_ki_n','s_ti_n_gi_m_gi','l_do_gi_m']);
    HX.propList($('#pPkg'), r, 'page', ['g_i_d_ch_v_m_c_ti_u','th_i_h_n_thanh_to_n','lead_id','sale_ph_tr_ch']);
    HX.propList($('#pResult'), r, 'page', ['giai_o_n_pipeline','t_l_th_nh_c_ng','ng_y_d_ki_n_ch_t','l_do_th_t_b_i','ng_y_c_p_nh_t_g_n_nh_t']);
    const rel = r.values.test;
    $('#relCount').textContent = `(${rel ? 1 : 0})`;
    $('#relBox').innerHTML = rel ? `<div class="rel"><span class="ms">link</span><div><span class="lnk">${esc(fmt(rel, F.test))}</span><small>Trường liên kết “Test”</small></div></div>`
      : `<div class="soon" style="padding:12px 0"><span class="ms">link_off</span>Chưa liên kết bản ghi nào</div>`;
  }
  HX.onChange = render;
  render();

  // Ô nổi bật: bấm để sửa trường tương ứng
  $('#hl').onclick = e => { const it = e.target.closest('[data-hl]'); if (!it || it.querySelector('.ed')) return; const f = F[it.dataset.hl], v = it.querySelector('.val');
    v.replaceChildren(editor(f, r.values[f.key], nv => { if (nv !== r.values[f.key]) { api.update(r.id, f.key, nv); toast(`Đã lưu “${f.name}”`); } render(); }, render, 'page')); };
  // Trường RELATION “Test”: sửa ở trang chi tiết (đúng ERP)
  $('#relEdit').onclick = () => { $('#relBox').replaceChildren(editor(F.test, r.values.test, nv => { api.update(r.id, 'test', nv); toast('Đã lưu “Test”'); render(); }, render, 'page')); };
  $('#moreProps').onclick = e => { const p = $('#leftProps'); p.classList.toggle('short'); e.target.textContent = p.classList.contains('short') ? 'Xem tất cả thuộc tính' : 'Thu gọn'; };
  document.querySelector('.tabs').onclick = e => { const t = e.target.closest('.tab'); if (!t) return;
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t)); document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + t.dataset.pane)); };
  $('#actBtn').onclick = e => { e.stopPropagation(); $('#actPop').classList.toggle('open'); };
  document.addEventListener('click', e => {
    if (e.target.closest('[data-wf]')) { $('#actPop').classList.remove('open'); HX.workflowDialog(r); return; }
    if (e.target.closest('[data-cols]')) { $('#actPop').classList.remove('open'); toast('Mở trang quản lý cột (Fields) của collection'); return; }
    if (!e.target.closest('#actPop')) $('#actPop').classList.remove('open');
  });
}
</script>
</body>
</html>
