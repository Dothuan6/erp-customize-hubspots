<!DOCTYPE html>
<html lang="vi" data-brand="crm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deals_Pipeline — HarnexAI CRM (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="crm-shared.css">
<style>
/* ═══ Màn danh sách bản ghi collection Deals_Pipeline ═══
   Chức năng: đúng màn /data/:id/records của ERP. Bố cục: index page HubSpot. */
.frame{position:relative}
.ph{display:flex;align-items:center;gap:8px;padding:16px 16px 0;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:700}
.ph .count{font-size:13px;color:var(--on-surface-variant)}
.ph-act{margin-left:auto;display:flex;gap:8px;align-items:center;position:relative}
.ph-act .hide-sm{display:none}
@media(min-width:600px){.ph-act .hide-sm{display:inline-flex}}

.vtabs{display:flex;align-items:flex-end;gap:2px;padding:8px 16px 0;border-bottom:1px solid var(--outline-variant);overflow-x:auto;position:relative}
.vtab{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;font-weight:600;color:var(--on-surface-variant);white-space:nowrap;
  border-bottom:2px solid transparent;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.vtab:hover{background:var(--surface-variant)}
.vtab[aria-selected="true"]{color:var(--on-surface);border-bottom-color:var(--primary);background:var(--surface-variant)}
.vtab .va{display:none;gap:0}
.vtab:hover .va,.vtab[aria-selected="true"] .va{display:inline-flex}
.vtab .va span{width:22px;height:22px;display:grid;place-items:center;border-radius:var(--radius-sm);color:var(--on-surface-variant)}
.vtab .va span:hover{background:var(--surface-2);color:var(--on-surface)}
.vform{display:flex;flex-direction:column;gap:10px;padding:8px}
.vform label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600}
.vform input,.vform select{height:32px;border:1px solid var(--outline);border-radius:var(--radius-md);padding:0 8px;background:var(--surface);font-weight:400}
.vform .row{display:flex;justify-content:flex-end;gap:6px}

.tools{display:flex;align-items:center;gap:8px;padding:10px 16px 0;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;width:240px;max-width:100%;border:1px solid var(--outline);border-radius:var(--btn-radius);color:var(--on-surface-variant)}
.search input{border:none;outline:none;background:none;flex:1;min-width:0;color:var(--on-surface)}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:var(--btn-radius);overflow:hidden}
.seg button{height:30px;padding:0 10px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.seg button[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.tools-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.grpsel{height:32px;border:1px solid var(--outline);border-radius:var(--btn-radius);padding:0 10px;background:var(--surface);font-size:13px;font-weight:600}

.fbar{display:flex;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--outline-variant);flex-wrap:wrap;position:relative}
.fbar .lb{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--on-surface-variant)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:var(--radius-pill);background:var(--primary-container);color:var(--on-primary-container);font-size:12px}
.fchip b{font-weight:700}
.fchip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.fchip button:hover{background:rgba(0,0,0,.08)}
.fadd{height:28px;padding:0 10px;border:1px dashed var(--outline);border-radius:var(--radius-pill);font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.fclear{margin-left:auto;font-size:12px;font-weight:600;color:var(--link)}
.fbuilder{display:flex;flex-direction:column;gap:8px;padding:10px;min-width:280px}
.fbuilder select,.fbuilder input{height:32px;border:1px solid var(--outline);border-radius:var(--radius-md);padding:0 8px;background:var(--surface)}
.fbuilder .row{display:flex;justify-content:flex-end;gap:6px}

.bulk{display:none;align-items:center;gap:10px;padding:6px 16px;background:var(--primary-container);color:var(--on-primary-container);font-size:13px;font-weight:600}
.bulk.on{display:flex}

.body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex}
/* Bảng (DataTable) */
.tw{flex:1;overflow:auto}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{border-bottom:1px solid var(--outline-variant);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px;height:40px}
body.compact th,body.compact td{height:33px}
th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:500;font-size:13px;color:var(--on-surface-variant);user-select:none;cursor:pointer}
th:hover{color:var(--on-surface)}
th .srt{margin-left:4px;font-size:11px}
th .rz{position:absolute;right:0;top:8px;bottom:8px;width:6px;cursor:col-resize;border-right:2px solid transparent}
th:hover .rz{border-right-color:var(--outline)}
td{cursor:text;background:var(--surface)}
td.num{text-align:right}
tbody tr:hover td{background:var(--surface-variant)}
tbody tr.sel td{background:var(--primary-container)}
td.cb,th.cb{width:44px;cursor:default;text-align:center}
td.cb input{opacity:0} tr:hover td.cb input,td.cb input:checked{opacity:1}
td.editing{overflow:visible;padding:4px 8px}
.pri{display:flex;align-items:center;gap:8px;min-width:0}
.ini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--primary-container);color:var(--on-primary-container);flex:none}
.pri .t{overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--link)}
.pv{display:none;margin-left:auto;height:24px;padding:0 8px;border:1px solid var(--outline);border-radius:var(--btn-radius);font-size:11px;font-weight:600;background:var(--surface);color:var(--on-surface);cursor:pointer;flex:none}
tr:hover .pv{display:inline-flex;align-items:center}
.empty{padding:48px 16px;text-align:center;color:var(--on-surface-variant)}
.colpop{max-height:360px;overflow-y:auto}
.colpop label{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 8px;font-size:13px;border-radius:var(--radius-sm);cursor:pointer}
.colpop label:hover{background:var(--surface-2)}

/* Kanban */
.kb{flex:1;display:flex;gap:12px;padding:12px 16px;overflow-x:auto;align-items:stretch}
.kcol{flex:none;width:82vw;max-width:280px;display:flex;flex-direction:column;min-height:0;background:var(--surface-variant);border:1px solid var(--outline-variant);border-radius:var(--radius-lg)}
@media(min-width:600px){.kcol{width:272px}}
.kh{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--outline-variant)}
.kh .n{font-size:12px;font-weight:700;color:var(--on-surface-variant)}
.kcards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.kcards.drop{background:var(--primary-container)}
.kc{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.kc:hover{border-color:var(--outline)}
.kc.dragging{opacity:.5}
.kc .tt{font-weight:600;color:var(--link)}
.kc .ln{font-size:12px;color:var(--on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .ln b{color:var(--on-surface);font-weight:500}
.kempty{border:1px dashed var(--outline);border-radius:var(--radius-md);padding:14px;text-align:center;font-size:12px;color:var(--on-surface-variant)}
.kpick{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--on-surface-variant)}

.foot{display:flex;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid var(--outline-variant);flex:none;flex-wrap:wrap}
.foot .info{font-size:13px;color:var(--on-surface-variant)}
.pager{display:flex;align-items:center;gap:6px;margin:0 auto;font-size:13px}
.foot .r{display:flex;gap:6px;align-items:center}
.fmt{height:32px;border:1px solid var(--outline);border-radius:var(--btn-radius);padding:0 8px;background:var(--surface);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>
  <main class="main"><div class="frame">
    <div class="ph">
      <h1 id="colName"></h1><span class="count" id="count"></span>
      <div class="ph-act">
        <button class="btn btn--secondary btn--icon" id="moreBtn" aria-label="Thêm" aria-haspopup="menu"><span class="ms sm">more_horiz</span></button>
        <div class="pop" id="morePop" role="menu" style="top:38px;left:0">
          <button class="mi" role="menuitem" data-toast="Đã ghim Deals_Pipeline vào sidebar"><span class="ms sm">push_pin</span>Ghim vào sidebar</button>
          <button class="mi" role="menuitem" data-toast="Chọn nhóm để ghim"><span class="ms sm">folder</span>Ghim vào nhóm…</button>
          <div class="sep"></div>
          <button class="mi" role="menuitem" id="gsBtn"><span class="ms sm">sync</span>Kết nối Google Sheet</button>
        </div>
        <a class="btn btn--secondary hide-sm" href="#" id="colsBtn" title="Quản lý cột (trường dữ liệu)"><span class="ms sm">edit</span>Cột</a>
        <button class="btn btn--secondary hide-sm" id="impBtn">Import</button>
        <button class="btn btn--primary" id="newBtn"><span class="ms sm">add</span>Tạo mới</button>
      </div>
    </div>

    <div class="vtabs" role="tablist" aria-label="View" id="vtabs"></div>
    <div class="pop" id="viewPop" style="top:0;left:0"></div>

    <div class="tools">
      <label class="search"><span class="ms sm">search</span><input id="q" placeholder="Tìm kiếm bản ghi..."><button id="qx" class="ms xs" style="display:none" aria-label="Xoá tìm kiếm">close</button></label>
      <div class="seg" role="group" aria-label="Mật độ hiển thị">
        <button aria-pressed="true" data-density="normal" title="Thoáng"><span class="ms sm">view_agenda</span>Thoáng</button>
        <button aria-pressed="false" data-density="compact" title="Gọn"><span class="ms sm">density_small</span>Gọn</button>
      </div>
      <div class="tools-r" id="toolsR"></div>
    </div>

    <div class="fbar" id="fbar"></div>
    <div class="pop" id="fPop" style="top:0;left:0"></div>
    <div class="bulk" id="bulk"><span id="bulkN"></span><button class="btn btn--text sm" id="bulkDel"><span class="ms sm">delete</span>Xoá</button><button class="btn btn--text sm" id="bulkCancel">Huỷ</button></div>

    <div class="body" id="body"></div>

    <div class="foot">
      <span class="info" id="footInfo"></span>
      <div class="pager"><button class="btn btn--secondary sm" id="prev"><span class="ms xs">chevron_left</span>Trước</button><span id="pg"></span><button class="btn btn--secondary sm" id="next">Sau<span class="ms xs">chevron_right</span></button></div>
      <div class="r">
        <button class="btn btn--secondary btn--icon" id="refresh" title="Làm mới" aria-label="Làm mới"><span class="ms sm">refresh</span></button>
        <select class="fmt" id="fmt" aria-label="Định dạng xuất"><option>.xlsx</option><option>.csv</option></select>
        <button class="btn btn--secondary" id="exportBtn"><span class="ms sm">download</span>Export</button>
      </div>
    </div>
  </div></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Chi tiết bản ghi"></aside>
<div class="modal-bg" id="modal"></div>
<div class="demo" id="demo" role="group" aria-label="Điều khiển mockup"></div>
<div class="toast" id="toast" role="status"></div>

<script src="crm-shared.js"></script>
<script>
const {FIELDS,F,api,esc,empty,fmt,display,chipCls,createdFmt,title,editor,toast,confirmBox,$} = HX;
HX.shell();
$('#colName').textContent = HX.COLLECTION.name;

/* ── Điều kiện lọc theo kiểu trường — đúng danh sách của ERP ── */
const OPS = {
  TEXT:[['eq','Bằng'],['neq','Khác'],['contains','Chứa'],['is_empty','Trống'],['is_not_empty','Không trống']],
  NUMBER:[['eq','Bằng'],['neq','Khác'],['gt','Lớn hơn'],['lt','Nhỏ hơn'],['is_empty','Trống'],['is_not_empty','Không trống']],
  SELECT:[['eq','Bằng'],['neq','Khác']],
  DATE:[['eq','Bằng'],['neq','Khác'],['gt','Lớn hơn'],['lt','Nhỏ hơn']],
  RELATION:[['eq','Bằng'],['neq','Khác']]
};
const isDate = f => f.type === 'DATE' || f.type === 'DATETIME' || f.type === '__created';
const opsOf = f => OPS[f.type === 'LONG_TEXT' ? 'TEXT' : isDate(f) ? 'DATE' : f.type] || OPS.TEXT;
const CREATED = {key:'__createdAt', name:'Ngày tạo', type:'__created'};
const fieldOf = k => k === '__createdAt' ? CREATED : F[k];
const filterFields = [CREATED, ...FIELDS];
const PAGE = 50;
const st = { view:'builtin-table', q:'', filters:[], sort:{key:'__createdAt',dir:'desc'}, hidden:[], sel:new Set(), page:1, groupBy:{ 'builtin-kanban':null }, widths:{} };
try { Object.assign(st.widths, JSON.parse(localStorage.getItem('smartdb-col-widths:' + HX.COLLECTION.id) || '{}')); } catch {}
const viewType = () => st.view === 'builtin-table' ? 'TABLE' : st.view === 'builtin-kanban' ? 'KANBAN' : (api.views().find(v => v.id === st.view) || {}).type;

const valOf = (r, key) => key === '__createdAt' ? r.createdAt : r.values[key];
function pass(r, fl){
  const f = fieldOf(fl.key), v = valOf(r, fl.key);
  if (isDate(f)) { if (empty(v)) return fl.op === 'neq';
    const a = String(v).slice(0,10), b = String(fl.value).slice(0,10);
    return fl.op === 'eq' ? a === b : fl.op === 'neq' ? a !== b : fl.op === 'gt' ? a > b : a < b; }
  switch (fl.op) {
    case 'eq': return String(v ?? '') === String(fl.value);
    case 'neq': return String(v ?? '') !== String(fl.value);
    case 'contains': return String(v ?? '').toLowerCase().includes(String(fl.value).toLowerCase());
    case 'gt': return Number(v) > Number(fl.value);
    case 'lt': return Number(v) < Number(fl.value);
    case 'is_empty': return empty(v);
    case 'is_not_empty': return !empty(v);
  }
  return true;
}
function rows(){
  let list = api.list().filter(r => st.filters.every(fl => pass(r, fl)));
  if (st.q) { const q = st.q.toLowerCase(); list = list.filter(r => FIELDS.some(f => String(fmt(r.values[f.key], f)).toLowerCase().includes(q))); }
  const s = st.sort || {key:'__createdAt', dir:'desc'}, d = s.dir === 'asc' ? 1 : -1;
  return [...list].sort((a, b) => { const x = valOf(a, s.key), y = valOf(b, s.key);
    if (empty(x) && empty(y)) return 0; if (empty(x)) return 1; if (empty(y)) return -1;
    return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'vi')) * d; });
}
function place(pop, anchor, w){ const r = anchor.getBoundingClientRect(), fr = document.querySelector('.frame').getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left - fr.left, fr.width - w)) + 'px'; pop.style.top = (r.bottom - fr.top + 4) + 'px'; }

/* ── View tabs: Bảng · Kanban (sẵn có) + view đã lưu (sửa / xoá) + Tạo View ── */
function renderTabs(){
  const tabs = [{id:'builtin-table',name:'Bảng',type:'TABLE',b:1},{id:'builtin-kanban',name:'Kanban',type:'KANBAN',b:1},...api.views()];
  $('#vtabs').innerHTML = tabs.map(v => `<button class="vtab" role="tab" aria-selected="${st.view === v.id}" data-view="${v.id}">
      <span class="ms sm">${v.type === 'KANBAN' ? 'view_kanban' : 'table_rows'}</span>${esc(v.name)}
      ${v.b ? '' : `<span class="va"><span data-vedit="${v.id}" title="Sửa view"><span class="ms xs">edit</span></span><span data-vdel="${v.id}" title="Xóa view"><span class="ms xs">close</span></span></span>`}</button>`).join('')
    + `<button class="btn btn--text btn--icon" id="vAdd" title="Tạo View" aria-label="Tạo View"><span class="ms sm">add</span></button>`;
}
function viewForm(anchor, v){
  const pop = $('#viewPop'); place(pop, anchor, 260);
  pop.innerHTML = `<form class="vform"><b>${v ? 'Sửa View' : 'Tạo View'}</b>
    <label>Tên View<input name="n" value="${v ? esc(v.name) : ''}" required></label>
    <label>Loại View<select name="t"><option value="TABLE" ${v && v.type === 'TABLE' ? 'selected' : ''}>Danh sách</option><option value="KANBAN" ${v && v.type === 'KANBAN' ? 'selected' : ''}>Kanban</option></select></label>
    <div class="row"><button type="button" class="btn btn--secondary sm" data-vcancel>Huỷ</button><button class="btn btn--primary sm">${v ? 'Lưu thay đổi' : 'Tạo View'}</button></div></form>`;
  pop.classList.add('open'); pop.querySelector('input').focus();
  pop.querySelector('form').onsubmit = e => { e.preventDefault(); const n = e.target.n.value.trim(), t = e.target.t.value; if (!n) return;
    let vs = api.views();
    if (v) vs = vs.map(x => x.id === v.id ? {...x, name:n, type:t} : x); else { const id = 'v' + Date.now(); vs = [...vs, {id, name:n, type:t}]; st.view = id; }
    api.saveViews(vs); pop.classList.remove('open'); toast(v ? 'Đã lưu thay đổi view' : 'Đã tạo view'); renderAll(); };
  pop.querySelector('[data-vcancel]').onclick = () => pop.classList.remove('open');
}
$('#vtabs').onclick = e => {
  const ed = e.target.closest('[data-vedit]'), dl = e.target.closest('[data-vdel]');
  if (ed) { e.stopPropagation(); viewForm(ed, api.views().find(v => v.id === ed.dataset.vedit)); return; }
  if (dl) { e.stopPropagation(); const v = api.views().find(x => x.id === dl.dataset.vdel);
    confirmBox('Xóa view', `Xóa view “${esc(v.name)}”? Bản ghi không bị ảnh hưởng.`, 'Xóa view', () => { api.saveViews(api.views().filter(x => x.id !== v.id)); if (st.view === v.id) st.view = 'builtin-table'; renderAll(); toast('Đã xóa view'); }); return; }
  if (e.target.closest('#vAdd')) { viewForm(e.target.closest('#vAdd')); return; }
  const t = e.target.closest('[data-view]'); if (t) { st.view = t.dataset.view; st.sel.clear(); st.page = 1; renderAll(); }
};

/* ── Thanh bộ lọc (RecordFilterBar): chip + Thêm bộ lọc + Xoá tất cả ── */
function renderFilters(){
  const txt = fl => { const f = fieldOf(fl.key), op = opsOf(f).find(o => o[0] === fl.op)[1];
    const vv = ['is_empty','is_not_empty'].includes(fl.op) ? '' : ` “${esc(f.type === 'RELATION' ? fmt(fl.value, f) : isDate(f) ? new Date(fl.value).toLocaleDateString('vi-VN') : fl.value)}”`;
    return `<b>${esc(f.name)}</b> ${op}${vv}`; };
  $('#fbar').innerHTML = `<span class="lb"><span class="ms sm">filter_list</span>Bộ lọc</span>`
    + st.filters.map((fl, i) => `<span class="fchip">${txt(fl)}<button data-frm="${i}" aria-label="Xóa bộ lọc"><span class="ms xs">close</span></button></span>`).join('')
    + `<button class="fadd" id="fAdd">+ Thêm bộ lọc</button>` + (st.filters.length ? `<button class="fclear" id="fClear">Xoá tất cả</button>` : '');
}
function filterBuilder(anchor){
  const pop = $('#fPop'); place(pop, anchor, 300);
  pop.innerHTML = `<div class="fbuilder"><select id="fbF" aria-label="Trường">${filterFields.map(f => `<option value="${f.key}">${esc(f.name)}</option>`).join('')}</select>
    <select id="fbO" aria-label="Điều kiện"></select><span id="fbV"></span>
    <div class="row"><button class="btn btn--secondary sm" id="fbX">Huỷ</button><button class="btn btn--primary sm" id="fbOk">Áp dụng</button></div></div>`;
  const fS = $('#fbF', pop), oS = $('#fbO', pop), vB = $('#fbV', pop);
  const syncV = () => { const f = fieldOf(fS.value), op = oS.value;
    if (['is_empty','is_not_empty'].includes(op)) { vB.innerHTML = ''; return; }
    if (f.type === 'SELECT') vB.innerHTML = `<select id="fbVal" style="width:100%">${f.choices.map(c => `<option>${esc(c)}</option>`).join('')}</select>`;
    else if (f.type === 'RELATION') vB.innerHTML = `<select id="fbVal" style="width:100%"><option value="t1">Bản ghi liên kết #1</option><option value="t2">Bản ghi liên kết #2</option><option value="t3">Bản ghi liên kết #3</option></select>`;
    else vB.innerHTML = `<input id="fbVal" style="width:100%" placeholder="Giá trị..." type="${f.type === 'NUMBER' ? 'number' : isDate(f) ? 'date' : 'text'}">`; };
  const syncO = () => { oS.innerHTML = opsOf(fieldOf(fS.value)).map(([v, l]) => `<option value="${v}">${l}</option>`).join(''); syncV(); };
  fS.onchange = syncO; oS.onchange = syncV; syncO();
  $('#fbX', pop).onclick = () => pop.classList.remove('open');
  $('#fbOk', pop).onclick = () => { const vi = $('#fbVal', pop); if (vi && vi.value === '') { vi.focus(); return; }
    st.filters.push({key:fS.value, op:oS.value, value: vi ? vi.value : null}); st.page = 1; pop.classList.remove('open'); renderAll(); };
  pop.classList.add('open');
}
$('#fbar').onclick = e => {
  const rm = e.target.closest('[data-frm]'); if (rm) { st.filters.splice(+rm.dataset.frm, 1); renderAll(); return; }
  if (e.target.closest('#fAdd')) { filterBuilder(e.target.closest('#fAdd')); return; }
  if (e.target.closest('#fClear')) { st.filters = []; renderAll(); }
};

/* ── Bảng (RecordTableView): sửa ô tại chỗ, sort ▲▼, đổi rộng cột, ẩn/hiện cột, chọn nhiều ── */
const DEFW = f => f.primary ? 240 : f.type === 'LONG_TEXT' ? 220 : f.type === 'SELECT' ? 190 : f.type === 'NUMBER' ? 170 : 180;
const W = f => st.widths[f.key] || DEFW(f);
const visFields = () => FIELDS.filter(f => !st.hidden.includes(f.key));
function renderTable(){
  const all = rows(), pages = Math.max(1, Math.ceil(all.length / PAGE)); st.page = Math.min(Math.max(1, st.page), pages);
  const list = all.slice((st.page - 1) * PAGE, st.page * PAGE), vis = visFields();
  const srt = k => st.sort && st.sort.key === k ? (st.sort.dir === 'asc' ? '▲' : '▼') : '';
  const total = 44 + vis.reduce((s, f) => s + W(f), 0) + 160 + 56;
  $('#body').innerHTML = `<div class="tw"><table style="width:${total}px;min-width:100%"><colgroup><col style="width:44px">${vis.map(f => `<col style="width:${W(f)}px">`).join('')}<col style="width:160px"><col style="width:56px"></colgroup>
    <thead><tr><th class="cb"><input type="checkbox" id="all" aria-label="Chọn tất cả" ${list.length && list.every(r => st.sel.has(r.id)) ? 'checked' : ''}></th>
    ${vis.map(f => `<th data-sort="${f.key}" title="Sắp xếp">${esc(f.name)}<span class="srt">${srt(f.key)}</span><span class="rz" data-rz="${f.key}" title="Kéo để đổi bề rộng · bấm đúp để về mặc định"></span></th>`).join('')}
    <th data-sort="__createdAt" title="Sắp xếp">Ngày tạo<span class="srt">${srt('__createdAt')}</span></th>
    <th style="cursor:default"><button class="btn btn--text btn--icon" id="colBtn" title="Ẩn/hiện cột" aria-label="Ẩn/hiện cột"><span class="ms sm">view_column</span></button></th></tr></thead>
    <tbody>${list.length ? list.map(r => `<tr data-id="${r.id}" class="${st.sel.has(r.id) ? 'sel' : ''}"><td class="cb"><input type="checkbox" data-sel="${r.id}" ${st.sel.has(r.id) ? 'checked' : ''} aria-label="Chọn ${esc(title(r))}"></td>
      ${vis.map(f => { const v = r.values[f.key];
        if (f.primary) return `<td data-k="${f.key}"><span class="pri">${empty(v) ? '<span class="nil">—</span>' : `<span class="ini">${esc(String(v).replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase())}</span><span class="t">${esc(v)}</span>`}<button class="pv" data-open="${r.id}">Xem trước</button></span></td>`;
        return `<td data-k="${f.key}" class="${f.type === 'NUMBER' ? 'num' : ''}" title="${typeof v === 'string' ? esc(v) : ''}">${display(v, f)}</td>`; }).join('')}
      <td style="color:var(--on-surface-variant);font-size:13px;cursor:default">${createdFmt(r.createdAt)}</td>
      <td style="cursor:pointer;text-align:center" data-open="${r.id}" title="Mở chi tiết"><span class="ms sm" style="color:var(--on-surface-variant)">chevron_right</span></td></tr>`).join('')
      : `<tr><td colspan="${vis.length + 3}" class="empty">${st.q ? `Không tìm thấy kết quả cho “${esc(st.q)}”` : 'Chưa có bản ghi nào'}</td></tr>`}</tbody></table></div>
    <div class="pop colpop" id="colPop" style="right:12px;top:44px"></div>`;
  $('#pg').textContent = `${st.page} / ${pages}`; $('#prev').disabled = st.page <= 1; $('#next').disabled = st.page >= pages;
  footer(all.length, pages);
}
function footer(n, pages){
  const tot = api.list().length;
  $('#footInfo').textContent = (st.filters.length || st.q) ? `Hiển thị ${n} / ${tot} bản ghi` : `${tot} bản ghi · Trang ${st.page}/${pages}`;
  $('#count').textContent = `${tot} bản ghi`;
  $('#bulk').classList.toggle('on', st.sel.size > 0); $('#bulkN').textContent = `Đã chọn ${st.sel.size} bản ghi`;
}
function openColPop(){ const p = $('#colPop'); p.innerHTML = '<div class="hd">Ẩn/hiện cột</div>' + FIELDS.map(f => `<label><input type="checkbox" data-hide="${f.key}" ${st.hidden.includes(f.key) ? '' : 'checked'}>${esc(f.name)}</label>`).join(''); p.classList.add('open'); }
$('#body').addEventListener('click', e => {
  const op = e.target.closest('[data-open]'); if (op) { e.stopPropagation(); HX.openPanel(op.dataset.open); return; }
  const c = e.target.closest('[data-card]'); if (c) { HX.openPanel(c.dataset.card); return; }
  if (e.target.closest('#colBtn')) { $('#colPop').classList.contains('open') ? $('#colPop').classList.remove('open') : openColPop(); return; }
  if (e.target.closest('#colPop')) return;
  const th = e.target.closest('th[data-sort]'); if (th && !e.target.closest('.rz')) { const k = th.dataset.sort;
    st.sort = !st.sort || st.sort.key !== k ? {key:k, dir:'asc'} : st.sort.dir === 'asc' ? {key:k, dir:'desc'} : null; renderTable(); return; }
  const td = e.target.closest('td[data-k]'); if (td && !td.classList.contains('editing')) {
    const r = api.get(td.parentElement.dataset.id), f = F[td.dataset.k]; td.classList.add('editing');
    td.replaceChildren(editor(f, r.values[f.key], nv => { if (nv !== r.values[f.key]) { api.update(r.id, f.key, nv); toast('Đã lưu'); } renderTable(); }, renderTable, 'table'));
  }
});
$('#body').addEventListener('change', e => {
  if (e.target.id === 'all') { rows().slice((st.page-1)*PAGE, st.page*PAGE).forEach(r => e.target.checked ? st.sel.add(r.id) : st.sel.delete(r.id)); renderTable(); }
  else if (e.target.dataset.sel) { e.target.checked ? st.sel.add(e.target.dataset.sel) : st.sel.delete(e.target.dataset.sel); renderTable(); }
  else if (e.target.dataset.hide) { const k = e.target.dataset.hide; st.hidden = e.target.checked ? st.hidden.filter(x => x !== k) : [...st.hidden, k]; renderTable(); openColPop(); }
  else if (e.target.id === 'grp') { st.groupBy[st.view] = e.target.value || null; renderKanban(); }
});
$('#body').addEventListener('dblclick', e => { const rz = e.target.closest('[data-rz]'); if (rz) { delete st.widths[rz.dataset.rz]; saveW(); renderTable(); } });
$('#body').addEventListener('mousedown', e => {
  const rz = e.target.closest('[data-rz]'); if (!rz) return; e.preventDefault(); e.stopPropagation(); const k = rz.dataset.rz, x0 = e.clientX, w0 = W(F[k]);
  const idx = visFields().findIndex(f => f.key === k), col = document.querySelectorAll('colgroup col')[1 + idx];
  const mv = ev => { st.widths[k] = Math.max(80, w0 + ev.clientX - x0); if (col) col.style.width = st.widths[k] + 'px'; };
  const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); saveW(); renderTable(); };
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
});
const saveW = () => { try { localStorage.setItem('smartdb-col-widths:' + HX.COLLECTION.id, JSON.stringify(st.widths)); } catch {} };

/* ── Kanban: chọn trường lựa chọn làm cột, kéo thả để đổi giá trị ──
   Như ERP: bản ghi chưa có giá trị ở trường làm cột thì không hiện trên board. */
const selectFields = FIELDS.filter(f => f.type === 'SELECT');
function renderKanban(){
  const gk = st.groupBy[st.view] ?? null;
  $('#toolsR').innerHTML = gk ? `<label for="grp" style="font-size:13px;color:var(--on-surface-variant)">Cột theo</label><select class="grpsel" id="grp">${selectFields.map(f => `<option value="${f.key}" ${f.key === gk ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>` : '';
  $('#pg').textContent = '1 / 1'; $('#prev').disabled = $('#next').disabled = true;
  if (!gk) {
    $('#body').innerHTML = `<div class="kpick"><span>Chọn field để làm cột Kanban</span><select class="grpsel" id="grp"><option value="">Chọn field...</option>${selectFields.map(f => `<option value="${f.key}">${esc(f.name)}</option>`).join('')}</select></div>`;
    footer(rows().length, 1); return;
  }
  const f = F[gk], list = rows();
  const extra = r => FIELDS.filter(x => !x.primary && x.key !== gk && !empty(r.values[x.key])).slice(0, 3);
  $('#body').innerHTML = `<div class="kb">${f.choices.map(c => { const items = list.filter(r => r.values[gk] === c);
    return `<section class="kcol"><div class="kh"><span class="chip ${gk === 'giai_o_n_pipeline' ? chipCls(c) : ''}">${esc(c)}</span><span class="n">${items.length}</span></div>
      <div class="kcards" data-drop="${esc(c)}">${items.length ? items.map(r => `<article class="kc" draggable="true" data-card="${r.id}"><span class="tt">${esc(title(r))}</span>
        ${extra(r).map(x => `<span class="ln">${esc(x.name)}: <b>${esc(fmt(r.values[x.key], x))}</b></span>`).join('')}</article>`).join('') : '<div class="kempty">Chưa có bản ghi</div>'}</div></section>`; }).join('')}</div>`;
  footer(list.length, 1);
}
$('#toolsR').addEventListener('change', e => { if (e.target.id === 'grp') { st.groupBy[st.view] = e.target.value || null; renderKanban(); } });
$('#body').addEventListener('dragstart', e => { const c = e.target.closest('[data-card]'); if (c) { c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.card); } });
$('#body').addEventListener('dragend', e => e.target.closest('[data-card]')?.classList.remove('dragging'));
$('#body').addEventListener('dragover', e => { const z = e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('drop'); } });
$('#body').addEventListener('dragleave', e => e.target.closest('[data-drop]')?.classList.remove('drop'));
$('#body').addEventListener('drop', e => { const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault();
  const r = api.get(e.dataTransfer.getData('text/plain')), gk = st.groupBy[st.view];
  if (r && r.values[gk] !== z.dataset.drop) { api.update(r.id, gk, z.dataset.drop); toast(`Đã chuyển sang “${z.dataset.drop}”`); } renderKanban(); });

/* ── Khác ── */
function renderAll(){
  renderTabs(); renderFilters();
  if (viewType() === 'KANBAN') { if (!(st.view in st.groupBy)) st.groupBy[st.view] = null; st.sel.clear(); renderKanban(); }
  else { $('#toolsR').innerHTML = ''; renderTable(); }
}
HX.onChange = () => renderAll();
$('#q').oninput = e => { st.q = e.target.value.trim(); $('#qx').style.display = st.q ? '' : 'none'; st.page = 1; renderAll(); };
$('#qx').onclick = () => { $('#q').value = ''; st.q = ''; $('#qx').style.display = 'none'; renderAll(); };
document.querySelector('.seg').onclick = e => { const b = e.target.closest('[data-density]'); if (!b) return;
  document.querySelectorAll('[data-density]').forEach(x => x.setAttribute('aria-pressed', x === b)); document.body.classList.toggle('compact', b.dataset.density === 'compact'); };
$('#moreBtn').onclick = e => { e.stopPropagation(); $('#morePop').classList.toggle('open'); };
$('#morePop').onclick = e => { const t = e.target.closest('[data-toast]'); if (t) toast(t.dataset.toast); $('#morePop').classList.remove('open'); };
$('#gsBtn').onclick = () => HX.sheetDialog();
$('#impBtn').onclick = () => HX.importDialog();
$('#colsBtn').onclick = e => { e.preventDefault(); toast('Mở trang quản lý cột (Fields) của collection'); };
$('#newBtn').onclick = () => HX.openCreate(() => renderAll());
$('#refresh').onclick = () => { renderAll(); toast('Đã làm mới'); };
$('#exportBtn').onclick = () => toast(`Mockup: xuất ${rows().length} bản ghi ra tệp ${$('#fmt').value}`);
$('#prev').onclick = () => { st.page--; renderAll(); }; $('#next').onclick = () => { st.page++; renderAll(); };
$('#bulkCancel').onclick = () => { st.sel.clear(); renderAll(); };
$('#bulkDel').onclick = () => confirmBox('Xoá bản ghi', `Xoá ${st.sel.size} bản ghi đã chọn? Không thể hoàn tác.`, 'Xoá', () => { const n = st.sel.size; api.remove([...st.sel]); st.sel.clear(); renderAll(); toast(`Đã xoá ${n} bản ghi`); });
document.addEventListener('click', e => { if (!e.target.closest('.pop') && !e.target.closest('#moreBtn,#colBtn,#fAdd,#vAdd,[data-vedit]')) document.querySelectorAll('.pop.open').forEach(p => p.classList.remove('open')); });
renderAll();
</script>
</body>
</html>
