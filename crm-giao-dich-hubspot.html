<!DOCTYPE html>
<html lang="vi" data-brand="crm">
<head>
<meta charset="utf-8">

<style>
/* ═══ Màn danh sách collection Deals_Pipeline (ghim trên sidebar với tên "Deals") ═══
   Chức năng: theo màn /data/:id/records của ERP.
   UX: theo trang Deals của HubSpot (views/…/list và board) — khảo sát 24/09/2026:
   · mặc định Board theo Giai Đoạn Pipeline · bấm tên bản ghi → trang chi tiết
   · nút Xem trước cạnh tên → panel dock bên phải · bấm ô → sửa tại chỗ
   · tiêu đề "Deals ⌄" chuyển đối tượng · Board/Table toggle · View settings ⚙ · thu gọn thanh lọc ⌃
   · menu ngữ cảnh ở tiêu đề cột · cột Board có Tổng giá trị + Giá trị có trọng số */
.frame{position:relative}
.ph{display:flex;align-items:center;gap:8px;padding:16px 16px 0;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:2px;font-size:24px;font-weight:600;border-radius:var(--radius-md);padding:0 4px;margin-left:-4px}
.ttl:hover{background:var(--surface-2)}
.ph .count{font-size:13px;color:var(--on-surface-variant)}
.ph-act{margin-left:auto;display:flex;gap:8px;align-items:center;position:relative}
.hide-sm{display:none!important}
@media(min-width:600px){.hide-sm{display:inline-flex!important}}

.vtabs{display:flex;align-items:flex-end;gap:2px;padding:8px 16px 0;border-bottom:1px solid var(--outline-variant);overflow-x:auto}
.vtab{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;font-weight:600;font-size:13px;color:var(--on-surface-variant);white-space:nowrap;
  border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
.vtab:hover{background:var(--surface-variant)}
.vtab[aria-selected="true"]{color:var(--on-surface);border-bottom-color:var(--on-surface);background:var(--surface-2)}

.tools{display:flex;align-items:center;gap:8px;padding:12px 16px 0;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;width:200px;max-width:100%;border:1px solid var(--outline);border-radius:var(--btn-radius);color:var(--on-surface-variant)}
.search input{border:none;outline:none;background:none;flex:1;min-width:0;color:var(--on-surface);font-size:13px}
.tools-r{margin-left:auto;display:flex;gap:6px;align-items:center;position:relative}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:var(--btn-radius);overflow:hidden}
.seg button{height:30px;width:34px;display:grid;place-items:center;color:var(--on-surface-variant)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--on-surface)}
.grpsel{height:32px;border:1px solid var(--outline);border-radius:var(--btn-radius);padding:0 10px;background:var(--surface);font-size:12px;font-weight:600;max-width:200px}
.pop-form{display:flex;flex-direction:column;gap:10px;padding:8px}
.pop-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600}
.pop-form input,.pop-form select{height:32px;border:1px solid var(--outline);border-radius:var(--radius-md);padding:0 8px;background:var(--surface);font-weight:400}
.pop-form .row{display:flex;justify-content:flex-end;gap:6px}
.segtxt{display:inline-flex;border:1px solid var(--outline);border-radius:var(--btn-radius);overflow:hidden}
.segtxt button{height:28px;padding:0 10px;font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.segtxt button[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}

.fbar{display:flex;align-items:center;gap:2px;padding:8px 12px 10px;flex-wrap:wrap}
#filterBtn[aria-pressed="true"]{background:var(--surface-2)}
.qf{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 6px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;color:var(--on-surface);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.qf:hover{background:var(--surface-2)} .qf.on{background:var(--primary-container);color:var(--on-primary-container)}
.qsep{width:1px;height:18px;background:var(--outline-variant);margin:0 6px}
.qa{width:28px;height:28px}
.qp{display:flex;flex-direction:column;gap:6px}
.qp .srch2{height:32px;flex:none}
.qp-op{display:inline-flex;align-items:center;gap:2px;align-self:flex-start;font-size:12.5px;font-weight:600;padding:2px 6px;border-radius:var(--radius-sm);background:var(--surface-2)}
.qp-l{max-height:280px;overflow-y:auto;display:flex;flex-direction:column}
.qp-d{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;border-radius:var(--radius-sm);text-align:left}
.qp-d:hover{background:var(--surface-2)} .qp-d.cur{background:var(--primary-container);color:var(--on-primary-container)}
.qp-d b{font-weight:600;font-size:13px} .qp-d small{font-size:11.5px;color:var(--on-surface-variant)}
.qp-f{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--outline-variant);padding-top:6px}
#fPop{max-height:min(460px,70vh);overflow-y:auto}
#fPop .mi input{accent-color:var(--primary)}
.xbtn{width:22px;height:22px;border-radius:var(--radius-sm);display:grid;place-items:center;flex:none;color:var(--on-surface-variant);margin-left:-6px}
.xbtn:hover{background:var(--surface-variant);color:var(--on-surface)}
.xbtn .ms{transition:transform .15s} .xbtn.on .ms{transform:rotate(90deg)}
.xrow>td{background:var(--surface-2)!important;height:auto!important;padding:8px 12px 12px 56px!important;white-space:normal;max-width:none!important;cursor:default}
.xin{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:8px 10px;max-width:900px}
.xh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.xh .btn{margin-left:auto}
table.xt{border-collapse:collapse;width:100%;table-layout:auto}
.xt th,.xt td{height:34px;padding:0 10px;border-bottom:1px solid var(--outline-variant);font-size:13px;text-align:left;white-space:nowrap;position:static}
.xt th{font-weight:500;color:var(--on-surface-variant);font-size:12px;background:none}
.xt tr:last-child td{border-bottom:none}
.na{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:13px;border-radius:var(--radius-sm);padding:2px 4px}
.na:hover{background:var(--surface-variant)}
.na.has{font-weight:500}
.na .ms{font-size:16px;color:var(--on-surface-variant)}
.kc .nx{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;border:1px solid #F5C26B;background:#FEF6E7;color:#7A4A00;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.kc .nx.has{border-color:var(--outline-variant);background:var(--surface-2);color:var(--on-surface)}
html[data-theme="dark"] .kc .nx{background:#3D2E12;color:#F5C26B;border-color:#7A5A1F}
.kc .sub2{font-size:12px;color:var(--on-surface-variant);margin-top:-3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.fcollapsed .fbar{display:none}
.fbar .lb{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:var(--radius-pill);background:var(--primary-container);color:var(--on-primary-container);font-size:12px}
.fchip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.fchip button:hover{background:rgba(0,0,0,.08)}
.fadd{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;font-size:12px;font-weight:600;color:var(--on-surface)}
.fadd:hover{background:var(--surface-2);border-radius:var(--btn-radius)}
.fclear{font-size:12px;font-weight:600;color:var(--link);margin-left:4px}
.fbuilder{display:flex;flex-direction:column;gap:8px;padding:10px;min-width:280px}
.fbuilder select,.fbuilder input{height:32px;border:1px solid var(--outline);border-radius:var(--radius-md);padding:0 8px;background:var(--surface)}
.fbuilder .row{display:flex;justify-content:flex-end;gap:6px}

.bulk{display:none;align-items:center;gap:10px;padding:6px 16px;background:var(--primary-container);color:var(--on-primary-container);font-size:13px;font-weight:600}
.bulk.on{display:flex}
.body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;border-top:1px solid var(--outline-variant)}

/* ── Bảng ── */
.tw{flex:1;overflow:auto}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{border-bottom:1px solid var(--outline-variant);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px;height:40px}
body.compact th,body.compact td{height:33px}
th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:500;font-size:13px;color:var(--on-surface-variant);user-select:none;cursor:pointer}
th:hover{color:var(--on-surface);background:var(--surface-variant)}
th .srt{margin-left:4px;font-size:11px}
th .hm{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:var(--radius-sm);display:none;place-items:center;background:var(--surface)}
th:hover .hm{display:grid}
th .rz{position:absolute;right:0;top:8px;bottom:8px;width:6px;cursor:col-resize;border-right:2px solid transparent}
th:hover .rz{border-right-color:var(--outline)}
td{background:var(--surface);cursor:default}
td[data-k]:hover{box-shadow:inset 0 0 0 1px var(--on-surface-variant);cursor:text}
td.num{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.sel td{background:var(--primary-container)}
td.cb,th.cb{width:44px;text-align:center;cursor:default}
td.editing{overflow:visible;padding:4px 8px;box-shadow:none!important}
td.pk{cursor:default}
.pri{display:flex;align-items:center;gap:8px;min-width:0}
.pri a{overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--link)}
.pri a:hover{text-decoration:underline}
.pvb{display:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--outline);background:var(--surface);place-items:center;flex:none;margin-left:auto;color:var(--on-surface)}
tr:hover .pvb{display:grid}
.pvb:hover{background:var(--primary-container)}
.empty{padding:48px 16px;text-align:center;color:var(--on-surface-variant)}
.colpop{text-align:left;font-weight:400;color:var(--on-surface);cursor:default}
.colsrch{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;margin:2px 2px 6px;border:1px solid var(--outline);border-radius:var(--btn-radius);color:var(--on-surface-variant)}
.colsrch input{flex:1;min-width:0;border:none;outline:none;background:none;color:var(--on-surface);font-size:13px}
.collist{max-height:260px;overflow-y:auto}

/* ── Board ── */
.kb{flex:1;display:flex;gap:10px;padding:12px 16px;overflow-x:auto;align-items:stretch}
.kcol{flex:none;width:82vw;max-width:300px;display:flex;flex-direction:column;min-height:0;background:#F0F0F0;border-radius:var(--radius-lg)}
html[data-theme="dark"] .kcol{background:var(--surface-variant)}
@media(min-width:600px){.kcol{width:300px}}
.kh{display:flex;align-items:center;gap:6px;padding:10px 10px 6px}
.kh .n{font-size:12px;font-weight:700;color:var(--on-surface-variant)}
.kcards{flex:1;overflow-y:auto;padding:4px 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.kcards.drop{outline:2px dashed var(--primary);outline-offset:-4px;border-radius:var(--radius-md)}
.kc{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:12px;display:flex;flex-direction:column;gap:5px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kc:hover{border-color:var(--outline);box-shadow:var(--shadow-2)}
.kc.dragging{opacity:.5}
.kc a.tt{font-weight:600;color:var(--link);align-self:flex-start}
.kc a.tt:hover{text-decoration:underline}
.kc .ln{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--on-surface);min-width:0}
.kc .ln .ms{font-size:15px;color:var(--on-surface-variant)}
.kc .ln span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc a.lk2{color:var(--link);font-weight:600}.kc a.lk2:hover{text-decoration:underline}
.kc .kf{display:flex;align-items:center;gap:6px;border-top:1px solid var(--outline-variant);padding-top:8px;margin-top:4px}
.kc .kf .qi{width:26px;height:26px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--on-surface-variant)}
.kc .kf .qi:hover{background:var(--surface-2);color:var(--on-surface)}
.kc .kf .rate{margin-left:auto;font-size:11px;font-weight:600;padding:1px 8px;border-radius:var(--radius-pill);border:1px solid var(--outline);color:var(--on-surface-variant)}
.kempty{padding:14px;text-align:center;font-size:12px;color:var(--on-surface-variant)}
.ksum{border-top:1px solid var(--outline);padding:8px 12px 10px;font-size:12px;color:var(--on-surface-variant);display:flex;flex-direction:column;gap:2px}
.ksum b{color:var(--on-surface)}
.ksum .ms{font-size:14px;vertical-align:-2px}
.knote{font-size:12px;color:var(--on-surface-variant);padding:0 16px 4px}

.foot{display:flex;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid var(--outline-variant);flex:none;flex-wrap:wrap}
.foot .pillc{font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--radius-pill);background:var(--surface-2)}
.foot .info{font-size:12px;color:var(--on-surface-variant)}
.pager{display:flex;align-items:center;gap:6px;margin:0 auto;font-size:13px}
.foot .r{display:flex;gap:6px;align-items:center}
.fmt{height:32px;border:1px solid var(--outline);border-radius:var(--btn-radius);padding:0 8px;background:var(--surface);font-size:13px}
</style>
</head>

<script>
const {FIELDS,F,api,esc,empty,fmt,display,pill,pillCls,createdFmt,title,editor,toast,confirmBox,$} = HX;
HX.shell();
$('#objName').textContent = HX.COLLECTION.label;
const DETAIL = id => HXC.url('deal', id);

/* ── Điều kiện lọc theo kiểu trường — đúng danh sách của ERP ── */
const OPS = {
  TEXT:[['eq','Bằng'],['neq','Khác'],['contains','Chứa'],['is_empty','Trống'],['is_not_empty','Không trống']],
  NUMBER:[['eq','Bằng'],['neq','Khác'],['gt','Lớn hơn'],['lt','Nhỏ hơn'],['is_empty','Trống'],['is_not_empty','Không trống']],
  SELECT:[['eq','Bằng'],['neq','Khác']], DATE:[['eq','Bằng'],['neq','Khác'],['gt','Lớn hơn'],['lt','Nhỏ hơn']], RELATION:[['eq','Bằng'],['neq','Khác']]
};
const isDate = f => f.type === 'DATE' || f.type === 'DATETIME' || f.type === '__created';
// Kiểu bổ sung dùng bộ điều kiện của kiểu gần nhất: Tiền tệ → Số · Trạng thái / Người dùng / Lựa chọn nhiều → Lựa chọn
const OPS_OF = {LONG_TEXT:'TEXT', URL:'TEXT', FILE:'TEXT', CURRENCY:'NUMBER', STATUS:'SELECT', USER:'SELECT', MULTI_SELECT:'SELECT', CHECKBOX:'SELECT'};
const opsOf = f => OPS[isDate(f) ? 'DATE' : OPS_OF[f.type] || f.type] || OPS.TEXT;
const valChoices = f => f.type === 'CHECKBOX' ? ['Có','Không'] : HX.optsOf(f);

function dRange(p){ const T0 = HXC.TODAY, d0 = new Date(T0.getFullYear(), T0.getMonth(), T0.getDate()), day = 864e5, wd = (d0.getDay() + 6) % 7, y = d0.getFullYear(), m = d0.getMonth(), q = Math.floor(m / 3) * 3;
  return ({ today:[+d0, +d0 + day], yesterday:[+d0 - day, +d0], tomorrow:[+d0 + day, +d0 + 2 * day], week:[+d0 - wd * day, +d0 + (7 - wd) * day], lastweek:[+d0 - (wd + 7) * day, +d0 - wd * day], nextweek:[+d0 + (7 - wd) * day, +d0 + (14 - wd) * day],

    d7:[+d0 - 6 * day, +d0 + day], d30:[+d0 - 29 * day, +d0 + day], n30:[+d0, +d0 + 30 * day], year:[+new Date(y, 0, 1), +new Date(y + 1, 0, 1)] })[p]; }
function passQ(r){ return Object.entries(st.qf).every(([k, v]) => { if (!v || (Array.isArray(v) && !v.length)) return true; const x = valOf(r, k);
  if (qIsDate(k)) { if (empty(x)) return false; const R = dRange(v), t = +new Date(String(x).length === 10 ? x + 'T00:00:00+07:00' : x); return t >= R[0] && t < R[1]; }
  return v.some(o => o === '__none' ? empty(x) : String(x) === o); }); }
function pass(r, fl){
  const f = fieldOf(fl.key), v = valOf(r, fl.key);
  if (isDate(f)) { if (empty(v)) return fl.op === 'neq'; const a = String(v).slice(0,10), b = String(fl.value).slice(0,10);
    return fl.op === 'eq' ? a === b : fl.op === 'neq' ? a !== b : fl.op === 'gt' ? a > b : a < b; }
  if (f.type === 'MULTI_SELECT' && (fl.op === 'eq' || fl.op === 'neq')) { const has = [].concat(v || []).includes(fl.value); return fl.op === 'eq' ? has : !has; }
  if (f.type === 'CHECKBOX') { const on = !!v === (fl.value === 'Có'); return fl.op === 'eq' ? on : !on; }
  switch (fl.op) {
    case 'eq': return String(v ?? '') === String(fl.value); case 'neq': return String(v ?? '') !== String(fl.value);
    case 'contains': return String(v ?? '').toLowerCase().includes(String(fl.value).toLowerCase());

$('#body').addEventListener('dblclick', e => { const rz = e.target.closest('[data-rz]'); if (rz) { delete st.widths[rz.dataset.rz]; saveW(); renderTable(); } });
$('#body').addEventListener('mousedown', e => {
  const rz = e.target.closest('[data-rz]'); if (!rz) return; e.preventDefault(); e.stopPropagation(); const k = rz.dataset.rz, x0 = e.clientX, w0 = W(F[k]);
  const col = document.querySelectorAll('colgroup col')[1 + visFields().findIndex(f => f.key === k)];
  const mv = ev => { st.widths[k] = Math.max(80, w0 + ev.clientX - x0); if (col) col.style.width = st.widths[k] + 'px'; };
  const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); saveW(); renderTable(); };
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
});
const saveW = () => { try { localStorage.setItem('smartdb-col-widths:' + HX.COLLECTION.id, JSON.stringify(st.widths)); } catch {} };

/* ── Board ──
   Cột = các lựa chọn của trường làm cột (mặc định Giai Đoạn Pipeline). Kéo thả để đổi giá trị (ERP).
   Chân cột: Tổng giá trị = Σ Tổng Cash-In Dự Kiến; Giá trị có trọng số = Σ (Cash-In × Tỷ Lệ Thành Công %),
   tính từ 2 trường sẵn có của ERP. */
const selectFields = FIELDS.filter(f => f.type === 'SELECT' || f.type === 'STATUS');
const money = v => Math.round(v).toLocaleString('vi-VN');
function renderKanban(){
  const gk = groupKey(), f = F[gk], list = rows();
  if (!f) { $('#grpBox').innerHTML = ''; $('#body').innerHTML = `<div class="empty" style="flex:1">Board cần ít nhất một trường Lựa chọn đơn hoặc Trạng thái. <a class="lnk" href="${HX.FIELDS_URL}?new=1">Thêm trường</a></div>`; footer(list.length, 1); return; }
  $('#grpBox').innerHTML = `<select class="grpsel" id="grp" aria-label="Cột theo" title="Trường làm cột">${selectFields.map(x => `<option value="${x.key}" ${x.key === gk ? 'selected' : ''}>Cột theo: ${esc(x.name)}</option>`).join('')}</select>`;
  const noVal = list.filter(r => empty(r.values[gk])).length;
  $('#body').innerHTML = `<div style="flex:1;display:flex;flex-direction:column;min-width:0">${noVal ? `<div class="knote" style="padding-top:8px">${noVal} bản ghi chưa có “${esc(f.name)}” không hiển thị trên board.</div>` : ''}<div class="kb">${f.choices.map(c => {
    const items = list.filter(r => r.values[gk] === c);
    const sum = F[CASH] ? items.reduce((s, r) => s + (Number(r.values[CASH]) || 0), 0) : 0;
    const w = F[CASH] && F[RATE] ? items.reduce((s, r) => s + (Number(r.values[CASH]) || 0) * (Number(r.values[RATE]) || 0) / 100, 0) : 0;
    const pct = sum ? Math.round(w / sum * 100) : 0;
    const wonLost = gk === STAGE && (c === '5. Closed Won' || c === '6. Closed Lost');
    return `<section class="kcol"><div class="kh">${pill(f, c)}<span class="n">${items.length}</span></div>
      <div class="kcards" data-drop="${esc(c)}">${items.length ? items.map(card).join('') : '<div class="kempty">Chưa có bản ghi</div>'}</div>
      ${!F[CASH] ? '' : `<div class="ksum"><span><b>${money(sum)}</b> | Tổng giá trị</span>
        <span>${wonLost ? (c === '5. Closed Won' ? 'Thắng (100%)' : 'Thua (0%)') : `<b>${money(w)}</b> (${pct}%) | Giá trị có trọng số`} <span class="ms" title="Tổng Cash-In Dự Kiến × Tỷ Lệ Thành Công (%) của từng bản ghi">info</span></span></div>`}</section>`; }).join('')}</div></div>`;
  $('#pager').style.visibility = 'hidden';
  footer(list.length - noVal, 1);
}
/* Thẻ board theo HubSpot: tên · ngày tạo · ngày chốt · amount · owner (+ công ty liên kết) · chân thẻ: Ghi chú · Task · hoạt động tiếp theo */
function card(r){
  const v = r.values, L = (ic, t, tip) => t ? `<span class="ln" ${tip ? `title="${tip}"` : ''}><span class="ms">${ic}</span><span class="t">${t}</span></span>` : '';
  const n = nextLabel(r);
  return `<article class="kc" draggable="true" data-card="${r.id}">
    <a class="tt" href="${DETAIL(r.id)}">${esc(title(r))}</a>${v.t_n_deal ? `<span class="sub2">${esc(v.t_n_deal)}</span>` : ''}
    ${(co => co ? L('domain', `<a class="lk2" href="${HXC.url('company', co.id)}">${esc(co.values.name)}</a>`, 'Công ty liên kết') : '')(HXC.assoc.companyOfDeal(r.id))}
    ${L('event_available', HXC.dOnly(r.createdAt), 'Ngày tạo')}
    ${L('event', v[CLOSE] && F[CLOSE] ? fmt(v[CLOSE], F[CLOSE]) : '', 'Ngày dự kiến chốt')}
    ${L('payments', empty(v[CASH]) || !F[CASH] ? '' : `<b>${fmt(v[CASH], F[CASH])}</b>`, 'Amount (Tổng Cash-In Dự Kiến)')}
    ${L('person', esc(v[OWNER] || ''), 'Sale phụ trách')}
    <div class="kf"><button class="qi" data-kq="NOTE" data-id="${r.id}" title="Thêm ghi chú" aria-label="Thêm ghi chú"><span class="ms sm">edit_note</span></button>
      <button class="qi" data-kq="TASK" data-id="${r.id}" title="Tạo task" aria-label="Tạo task"><span class="ms sm">task_alt</span></button>
      <span class="nx ${n ? 'has' : ''}" title="${n ? esc(n.full) : 'Không có task / cuộc họp sắp tới'}">${n ? `<span class="ms" style="font-size:13px">${n.ic}</span>${esc(n.t)}` : '— | Chưa có lịch'}</span></div></article>`;
}
$('#grpBox').addEventListener('change', e => { if (e.target.id === 'grp') { st.groupBy[st.view] = e.target.value; renderKanban(); } });
$('#body').addEventListener('dragstart', e => { const c = e.target.closest('[data-card]'); if (c) { c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.card); } });
$('#body').addEventListener('dragend', e => e.target.closest('[data-card]')?.classList.remove('dragging'));
$('#body').addEventListener('dragover', e => { const z = e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('drop'); } });
$('#body').addEventListener('dragleave', e => e.target.closest('[data-drop]')?.classList.remove('drop'));
$('#body').addEventListener('drop', e => { const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault();
  const r = api.get(e.dataTransfer.getData('text/plain')), gk = groupKey();
  if (r && r.values[gk] !== z.dataset.drop) { api.update(r.id, gk, z.dataset.drop); toast(`Đã chuyển sang “${z.dataset.drop}”`); } renderKanban(); });

/* ── Khác ── */
function renderAll(){
  renderTabs(); renderFilters();
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode()));
  if (mode() === 'KANBAN') { st.sel.clear(); renderKanban(); } else { $('#grpBox').innerHTML = ''; renderTable(); }
}
HX.onChange = () => renderAll();
$('#q').oninput = e => { st.q = e.target.value.trim(); st.page = 1; renderAll(); };
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'l') { e.preventDefault(); closePops(); editColumns(); return; }
  if (e.key === 'Escape') closePops(); if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); } });
$('#moreBtn').onclick = e => { e.stopPropagation(); closePops($('#morePop')); $('#morePop').classList.toggle('open'); };
document.addEventListener('click', e => {
  const t = e.target.closest('[data-toast]'); if (t) { toast(t.dataset.toast); closePops(); return; }
  if (e.target.closest('#morePop [data-ecols]')) { closePops(); editColumns(); return; }
  if (!e.target.closest('.pop')) closePops();
});
$('#gsBtn').onclick = () => HX.sheetDialog();
$('#addBtn').onclick = e => { e.stopPropagation(); closePops($('#addPop')); $('#addPop').classList.toggle('open'); };
$('#impBtn').onclick = () => { closePops(); HX.importDialog(); };
$('#newBtn').onclick = () => { closePops(); HX.openCreate(() => renderAll()); };
$('#resetBtn').onclick = () => { st.qf = {}; st.quick = null; st.filters = []; st.q = ''; $('#q').value = ''; st.sort = {key:'__createdAt', dir:'desc'}; st.exp = {}; delete HIDDEN[st.view]; if (st.view === 'all') HIDDEN.all = FIELDS.filter(f => !f.primary && !['t_n_deal', STAGE, CASH, 'ng_y_d_ki_n_ch_t', 'sale_ph_tr_ch'].includes(f.key)).map(f => f.key); try { localStorage.setItem(HKEY, JSON.stringify(HIDDEN)); } catch {} renderAll(); toast('Đã khôi phục view mặc định'); };
$('#cloneBtn').onclick = () => toast('Nhân bản view hiện tại thành view mới (dùng “+” ở thanh view để đặt tên)');
$('#refresh').onclick = () => { renderAll(); toast('Đã làm mới'); };
$('#exportBtn').onclick = () => toast(`Mockup: xuất ${rows().length} bản ghi ra tệp ${$('#fmt').value}`);
$('#prev').onclick = () => { st.page--; renderAll(); }; $('#next').onclick = () => { st.page++; renderAll(); };
$('#bulkCancel').onclick = () => { st.sel.clear(); renderAll(); };
$('#bulkDel').onclick = () => confirmBox('Xoá bản ghi', `Xoá ${st.sel.size} bản ghi đã chọn? Không thể hoàn tác.`, 'Xoá', () => { const n = st.sel.size; api.remove([...st.sel]); st.sel.clear(); renderAll(); toast(`Đã xoá ${n} bản ghi`); });
renderAll();
</script>
</body>
</html>
