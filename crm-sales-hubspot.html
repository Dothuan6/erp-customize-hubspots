<!DOCTYPE html>
<html lang="vi" data-brand="crm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales — HarnexAI CRM (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0..1,0&display=block" rel="stylesheet">
<script>/* Chỉ hiện icon khi font Material Symbols đã tải xong, tránh lộ tên icon ("edit", "call"…) lúc tải lại trang */
(function(){var d=document,n=0;function ok(){d.documentElement.classList.add('icons-ready')}
function go(){if(!d.fonts||!d.fonts.load)return ok();d.fonts.load('20px "Material Symbols Outlined"').then(function(r){r&&r.length?ok():retry()},retry)}
function retry(){if(n++<120)setTimeout(go,250)}
d.readyState==='loading'?d.addEventListener('DOMContentLoaded',go):go()})();</script>
<link rel="stylesheet" href="crm-shared.css">
<style>
/* ═══ Phần 7 · Bảng dành cho Sale (nhân viên kinh doanh) ═══
   Danh sách = kiểu trang danh sách HubSpot (tiêu đề · view tabs · search · kỳ · bảng sắp xếp được) + dải KPI như "Sales workspace / Leaderboard".
   Chi tiết (?id=) = bố cục record page 3 cột: định danh + thông tin | KPI · pipeline theo giai đoạn · việc cần làm · hoạt động | Deals · Companies · Contacts sở hữu.
   Dữ liệu: db.sales (HXC) — liên kết với Contact owner / Company owner / "Sale phụ trách" của Deal theo tên. */
.frame{position:relative}
.ph{display:flex;align-items:center;gap:8px;padding:16px 16px 0;flex-wrap:wrap}
.ttl{font-size:24px;font-weight:600}
.ph .count{font-size:13px;color:var(--on-surface-variant)}
.ph-act{margin-left:auto;display:flex;gap:8px;align-items:center}
.vtabs{display:flex;align-items:flex-end;gap:2px;padding:8px 16px 0;border-bottom:1px solid var(--outline-variant);overflow-x:auto}
.vtab{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;font-weight:600;font-size:13px;color:var(--on-surface-variant);white-space:nowrap;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
.vtab:hover{background:var(--surface-variant)}
.vtab[aria-selected="true"]{color:var(--on-surface);border-bottom-color:var(--on-surface);background:var(--surface-2)}
.tools{display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;width:220px;max-width:100%;border:1px solid var(--outline);border-radius:var(--btn-radius);color:var(--on-surface-variant)}
.search input{border:none;outline:none;background:none;flex:1;min-width:0;color:var(--on-surface);font-size:13px}
.segtxt{display:inline-flex;border:1px solid var(--outline);border-radius:var(--btn-radius);overflow:hidden}
.segtxt button{height:30px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--on-surface-variant)}
.segtxt button[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.tools .rg{font-size:12px;color:var(--on-surface-variant)}
/* Dải KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px 12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kpi{border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:10px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--on-surface-variant);display:flex;align-items:center;gap:4px}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--on-surface-variant);margin-top:2px}
.kpi.warn .v{color:var(--error)}
/* ═══ Sales Workspace (07/10/2026) — khung tab + Summary ═══ */
.who{display:inline-flex;align-items:center;gap:2px;font-size:20px;font-weight:600;border-radius:var(--radius-md);padding:0 6px;height:34px}
.who:hover{background:var(--surface-2)}
.wsep{width:1px;height:22px;background:var(--outline);margin:0 4px}
.vtabs .vtab{text-decoration:none}
.vtab .soonb{font-size:10px;font-weight:700;padding:1px 5px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--on-surface-variant)}
.ws{flex:1;min-height:0;overflow:auto;background:var(--page-bg);padding:12px}
.ws-g{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
@media(min-width:1100px){.ws-g{grid-template-columns:minmax(0,1fr) 340px}}
.ws-c{display:flex;flex-direction:column;gap:12px;min-width:0}
.ws .kpis{padding:0;margin:0}
.ws .kpi{background:var(--surface)}
.wc{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg)}
.wc-h{display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}
.wc-h h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.wc-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.wc-h .tgc{width:26px;height:26px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--on-surface-variant)}
.wc-h .tgc:hover{background:var(--surface-2)}
.wc-b{padding:0 14px 14px}
.wc.shut .wc-b{display:none} .wc.shut .tgc .ms{transform:rotate(-90deg)}
.tcnt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
@media(min-width:600px){.tcnt{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tcnt button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid var(--outline-variant);border-radius:var(--radius-md);text-align:left}
.tcnt button:hover{background:var(--surface-2)}
.tcnt button[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.tcnt b{font-size:22px;font-weight:700;line-height:1.1}
.tcnt span{font-size:12px;color:var(--on-surface-variant)}
.tcnt .bad b{color:var(--error)}
.wl{display:flex;flex-direction:column}
.wi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--outline-variant);font-size:13px;min-width:0}
.wi:first-child{border-top:none}
.wi>.ms{color:var(--on-surface-variant);margin-top:1px}
.wi input[type=checkbox]{accent-color:var(--primary);margin-top:3px;flex:none}
.wi .x{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wi .x b{font-weight:600;overflow-wrap:anywhere}
.wi .x small{font-size:12px;color:var(--on-surface-variant);overflow-wrap:anywhere}
.wi a{color:var(--link);font-weight:600}
.wi a:hover{text-decoration:underline}
.wi .due{font-size:12px;white-space:nowrap;color:var(--on-surface-variant)} .wi .due.od{color:var(--error);font-weight:600}
.wi .btn{flex:none}
.wi .tm{font-size:12px;font-weight:700;min-width:44px;color:var(--on-surface)}
.wempty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;color:var(--on-surface-variant);padding:14px 4px}
.wempty .ms{font-size:28px;max-width:none}
.wmore{font-size:12.5px;font-weight:600;color:var(--link);padding-top:8px;display:inline-block}
@media(max-width:760px){ .ws{overflow:visible} }
/* Sales Workspace phần 2: Tasks · Lịch · Feed · Leads · Deals */
.ws-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px}
.ws-bar .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ws-bar .search{background:var(--surface)}
.ws-tw{overflow-x:auto;border-top:1px solid var(--outline-variant)}
.ws-tw .lt th,.ws-tw .lt td{height:44px}
.ws-tw .lt>tbody>tr{cursor:default}
.ws-tw .lt td a{color:var(--link);font-weight:600}
.ws-tw .lt td a:hover{text-decoration:underline}
.ws-tw .lt td.wrap{white-space:normal;min-width:220px}
.ws-tw .lt input[type=checkbox]{accent-color:var(--primary)}
.ws-tw .done td{color:var(--on-surface-variant)} .ws-tw .done .tt{text-decoration:line-through}
.ws-foot{padding:10px 14px;font-size:12px;color:var(--on-surface-variant);border-top:1px solid var(--outline-variant);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.prio{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--on-surface-variant)}
.prio.hi{background:var(--error-container);color:var(--error)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.chk input{accent-color:var(--primary)}
/* Lịch */
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-nav b{font-size:15px;min-width:170px;text-align:center}
.cal{display:grid;gap:1px;background:var(--outline-variant);border-top:1px solid var(--outline-variant)}
.cal.wk{grid-template-columns:repeat(var(--n),minmax(100px,1fr));overflow-x:auto}
.cal.mo{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.cal-d{background:var(--surface);min-height:110px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal.wk .cal-d{min-height:340px}
.cal-d.out{background:var(--surface-2)} .cal-d.out .dn{color:var(--on-surface-variant)}
.cal-h{background:var(--surface);padding:6px;font-size:12px;font-weight:600;color:var(--on-surface-variant);text-align:center}
.dn{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.dn .d{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;padding:0 4px}
.cal-d.today .dn .d{background:var(--primary);color:var(--on-primary)}
.ev{display:flex;flex-direction:column;align-items:stretch;width:100%;overflow:hidden;gap:1px;padding:4px 6px;border-radius:var(--radius-sm);font-size:12px;border-left:3px solid var(--c1);background:var(--surface-2);min-width:0;text-align:left;color:var(--on-surface)}
.ev.tk{border-left-color:var(--c5)} .ev.done{opacity:.55;text-decoration:line-through}
.ev b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev small{color:var(--on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal.mo .ev small{display:none}
.evmore{font-size:11.5px;color:var(--on-surface-variant);padding:0 6px}
.cal-day{padding:0 14px 14px}
@media(max-width:760px){ .cal.mo .ev b{font-size:11px} .cal-d{padding:4px;min-height:74px} }
/* Feed */
.fd-day{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--on-surface-variant);padding:14px 0 4px}
.delta{font-size:11.5px;font-weight:700} .delta.up{color:var(--success)} .delta.dn2{color:var(--error)}
/* Hàng đợi task */
.tq-p{font-size:12px;font-weight:700;color:var(--on-surface-variant)}
.tq-t{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.tq-m{display:flex;flex-direction:column;gap:6px;font-size:13px}
.tq-m span>b{font-weight:600}
.tq-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden} .tq-bar i{display:block;height:100%;background:var(--primary)}
/* Panel chọn thành viên */
.mb-i{align-items:flex-start;padding:8px 10px;min-height:0;border-radius:var(--radius-sm);display:flex;gap:10px;width:100%;font-size:13px}
.mb-i:hover{background:var(--surface-2)} .mb-i.dis{opacity:.6}
.mb-i input{accent-color:var(--primary);margin-top:3px}
.mb-i .x{flex:1;min-width:0;display:flex;flex-direction:column} .mb-i small{font-size:12px;color:var(--on-surface-variant)}
/* Sales Workspace phần 3: Chỉ tiêu (Goals) */
.gfs{align-items:flex-end}
.gf{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:600;color:var(--on-surface-variant)}
.gf select{height:32px;min-width:150px;max-width:220px;border:1px solid var(--outline);border-radius:var(--radius-md);padding:0 8px;background:var(--surface);color:var(--on-surface);font-size:13px;font-weight:500}
.gtag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;background:var(--primary-container);color:var(--on-primary-container);white-space:nowrap}
.gtag.ok{background:var(--success-container);color:var(--success)} .gtag.bad{background:var(--error-container);color:var(--error)} .gtag.mut{background:var(--surface-2);color:var(--on-surface-variant)}
.gcell b{display:block;font-weight:600} .gcell small{display:block;font-size:11.5px;color:var(--on-surface-variant)}
.gcell.achieved b{color:var(--success)} .gcell.missed b{color:var(--error)}
.gleg{display:inline-flex;align-items:center;gap:6px} .gleg i{width:9px;height:9px;border-radius:50%;margin-left:8px;background:var(--on-surface)} .gleg i.achieved{background:var(--success)} .gleg i.missed{background:var(--error)}
.ws-tw .gteam td{background:var(--surface-2)} .ws-tw .gteam .nmcol{background:var(--surface-2)}
.ginfo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;padding:0 14px 14px}
@media(min-width:900px){.ginfo{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ginfo div{display:flex;flex-direction:column;gap:2px;min-width:0} .ginfo span{font-size:12px;color:var(--on-surface-variant)} .ginfo b{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.gsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
@media(min-width:900px){.gsum{grid-template-columns:2fr 1fr 1fr 1fr}}
.gtwo{display:grid;grid-template-columns:1fr;gap:12px} @media(min-width:900px){.gtwo{grid-template-columns:3fr 2fr}}
.gcard{border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:12px 14px;min-width:0}
.gcard h3{font-size:13px;font-weight:600;color:var(--on-surface-variant);margin-bottom:6px}
.gcard p{font-size:12px;margin-top:6px}
.gbig{font-size:24px;font-weight:700;line-height:1.2;margin-bottom:6px} .gbig small{font-size:14px;font-weight:500;color:var(--on-surface-variant)} .gbig.ok{color:var(--success)} .gbig.bad{color:var(--error)}
.gcard .stg .row .t{position:relative;overflow:visible} .gcard .stg .row .t em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--on-surface);border-radius:1px}
.gcard .stg .row .t i.ok{background:#00A884} .gcard .stg .row .t i.mid{background:#F5A623}
@media(max-width:600px){.gcard .stg .row{grid-template-columns:96px 1fr;row-gap:2px} .gcard .stg .row .n{grid-column:1/-1;text-align:left}}
/* Trình tạo goal */
.wzs{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.wzs span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--on-surface-variant);padding-right:14px}
.wzs b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-size:12px}
.wzs .on{color:var(--on-surface)} .wzs .on b{background:var(--primary);color:var(--on-primary)} .wzs .done b{background:var(--primary-container);color:var(--on-primary-container)}
.gtpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.gtpl button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border:1px solid var(--outline-variant);border-radius:var(--radius-md);text-align:left;min-height:104px}
.gtpl button:hover{background:var(--surface-2)} .gtpl button[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.gtpl .ms{font-size:24px;max-width:none;color:var(--primary)} .gtpl b{font-size:14px} .gtpl small{font-size:12px;color:var(--on-surface-variant)}
.gpick{display:grid;grid-template-columns:1fr;gap:12px} @media(min-width:760px){.gpick{grid-template-columns:160px 1fr}}
.gcat button{width:100%;text-align:left;height:34px;padding:0 12px;border-radius:var(--radius-sm);font-weight:600;font-size:13px} .gcat button[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.gform{max-width:560px} .gform .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gfs2{border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px} .gfs2 legend{font-size:13px;font-weight:600;padding:0 4px}
.field-form label.chk{font-weight:500}
.gin{width:96px;height:30px;border:1px solid var(--outline);border-radius:var(--radius-sm);padding:0 6px;text-align:right;background:var(--surface);color:var(--on-surface)}
.gin:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
.gtt td{height:48px}
/* Board Đội sale theo Trạng thái (mặc định) */
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:var(--btn-radius);overflow:hidden;margin-left:auto}
.seg button{height:30px;width:34px;display:grid;place-items:center;color:var(--on-surface-variant)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--on-surface)}
.body.brd{overflow:hidden;display:flex}
.kb{flex:1;display:flex;gap:10px;padding:12px 16px;overflow-x:auto;align-items:stretch}
.kcol{flex:none;width:82vw;max-width:300px;display:flex;flex-direction:column;min-height:0;background:#F0F0F0;border-radius:var(--radius-lg)}
html[data-theme="dark"] .kcol{background:var(--surface-variant)}
@media(min-width:600px){.kcol{width:300px}}
.kh{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;font-weight:700;font-size:13px}
.kh .n{font-size:12px;font-weight:700;color:var(--on-surface-variant)}
.kh .sm2{margin-left:auto;font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.kcards{flex:1;overflow-y:auto;padding:4px 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.kcards.drop{outline:2px dashed var(--primary);outline-offset:-4px;border-radius:var(--radius-md)}
.kc{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kc:hover{border-color:var(--outline);box-shadow:var(--shadow-2)}
.kc.dragging{opacity:.5}
.kc .ln{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px}
.kc .ln>span:first-child{color:var(--on-surface-variant)}
.kc .bar{min-width:0}
.kempty{padding:14px;text-align:center;font-size:12px;color:var(--on-surface-variant)}
@media(max-width:760px){ .body.brd{overflow:visible} .kcards{overflow:visible} }
/* Bảng */
.body{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--outline-variant)}
table.lt{border-collapse:separate;border-spacing:0;min-width:100%}
.lt th,.lt td{border-bottom:1px solid var(--outline-variant);text-align:left;white-space:nowrap;padding:0 12px;height:52px}
.lt th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:500;font-size:13px;color:var(--on-surface-variant);cursor:pointer;user-select:none;height:40px}
.lt th:hover{color:var(--on-surface);background:var(--surface-variant)}
.lt th.num,.lt td.num{text-align:right}
.lt th .srt{vertical-align:-2px;margin-left:2px}
.lt td{font-size:13.5px}
.lt>tbody>tr{cursor:pointer}
.lt>tbody>tr:hover>td{background:var(--surface-2)}
.lt .nmcol{min-width:240px;position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--outline-variant)}
.lt th.nmcol{z-index:3}
.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--on-surface-variant);flex:none}
.rk.g1{background:#FFE08A;color:#6B4E00}
.pri{display:flex;align-items:center;gap:10px;min-width:0}
.pri a{font-weight:600;color:var(--link)}
.pri a:hover{text-decoration:underline}
.pri small{display:block;font-size:12px;color:var(--on-surface-variant)}
.bar{display:flex;align-items:center;gap:8px;min-width:150px}
.bar .t{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;background:var(--c1)}
.bar .t i.ok{background:#00A884} .bar .t i.mid{background:#F5A623} .bar .t i.low{background:var(--c1)}
.bar b{font-size:12.5px;min-width:38px;text-align:right}
.od{color:var(--error);font-weight:600}
.st-off{opacity:.55}
.foot{display:flex;align-items:center;gap:6px;padding:8px 16px;border-top:1px solid var(--outline-variant);flex:none;font-size:12px;color:var(--on-surface-variant)}
.foot .pillc{font-weight:600;padding:3px 10px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--on-surface)}
.empty{padding:48px 16px;text-align:center;color:var(--on-surface-variant)}
@media(max-width:760px){ .frame:not(.rec){overflow:auto} .frame:not(.rec)>*{flex:none} .body{overflow-x:auto;overflow-y:visible} .foot span:not(.pillc){display:none} .lt .nmcol{min-width:200px} }
/* Chi tiết */
.frame.rec{overflow:auto;background:var(--page-bg)}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:12px;align-items:start}
@media(min-width:905px){ .grid{grid-template-columns:320px 1fr} .col-r{grid-column:1/-1} }
@media(min-width:1240px){ .grid{grid-template-columns:320px minmax(0,1fr) 320px} .col-r{grid-column:auto} }
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius-lg)}
.ch{display:flex;align-items:center;gap:6px;padding:12px 14px;font-weight:600}
.ch .r{margin-left:auto;display:flex;gap:2px;align-items:center}
.cb{padding:0 14px 14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 8px}
.back{display:inline-flex;align-items:center;font-size:14px;font-weight:600}
.back:hover{color:var(--link)}
.idt{display:flex;gap:12px;align-items:center;padding:12px 14px 4px}
.idt .ic{width:48px;height:48px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;flex:none;font-weight:700;font-size:16px}
.idt h1{font-size:20px;font-weight:700;line-height:1.3}
.sub{padding:0 14px 6px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.sub a{color:var(--link);font-weight:600}
.qa{display:flex;justify-content:space-around;gap:4px;padding:10px 14px 14px}
.qa a,.qa button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--on-surface)}
.qa .o{width:36px;height:36px;border-radius:50%;border:1px solid var(--outline);display:grid;place-items:center}
.qa a:hover .o,.qa button:hover .o{background:var(--surface-2)}
.meta{font-size:12px;color:var(--on-surface-variant);padding:0 14px 14px}
.dk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.dk{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stg{display:flex;flex-direction:column;gap:8px}
.stg .row{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.stg .row .t{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.stg .row .t i{display:block;height:100%;background:var(--c1);border-radius:4px}
.stg .row .n{text-align:right;font-weight:600;white-space:nowrap}
.ri{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--outline-variant);font-size:13px}
.ri:first-child{border-top:none}
.ri .ms{color:var(--on-surface-variant);margin-top:1px}
.ri a{color:var(--link);font-weight:600}
.ri .x{flex:1;min-width:0}
.ri .nil{font-size:12px}
.ai-l{display:flex;flex-direction:column}
.ai-l a.it{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 0;border-top:1px solid var(--outline-variant);font-size:13px;min-width:0}
.ai-l a.it:first-child{border-top:none}
.ai-l a.it .nm{font-weight:600;color:var(--link);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.kpi .bar{min-width:0;margin-top:4px}
.perf-rg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ai-l a.it:hover .nm{text-decoration:underline}
.ai-l a.it small{color:var(--on-surface-variant);white-space:nowrap}
.ac-empty{padding:4px 0 6px}
.pop-form{display:flex;flex-direction:column;gap:10px}
.fpop{position:fixed;z-index:80;max-height:min(420px,70vh);overflow-y:auto}
.tgl{display:inline-flex;align-items:center;gap:4px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>
  <main class="main"><div class="frame" id="frame"></div></main>
</div>
<div class="pop fpop" id="fpop" role="menu"></div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"></aside>
<div class="modal-bg" id="modal"></div>
<div class="demo" id="demo" role="group" aria-label="Điều khiển mockup"></div>
<div class="toast" id="toast" role="status"></div>

<script src="crm-shared.js"></script>
<script src="crm-objects.js"></script>
<script src="crm-leads.js"></script>
<script>
const { esc, display, toast, confirmBox, $ } = HX;
HX.shell('sales');
const qs = new URLSearchParams(location.search);
const NOW = HXC.TODAY, F = HX.F;
const short = n => { n = Number(n) || 0; return (n >= 1e9 ? (n / 1e9).toFixed(1).replace('.', ',') + ' tỷ' : n >= 1e6 ? (Math.round(n / 1e5) / 10).toString().replace('.', ',') + ' tr' : n.toLocaleString('vi-VN')) + ' ₫'; };
const RANGES = [['month','Tháng này'],['quarter','Quý này'],['year','Năm nay']];
function range(k) { const y = NOW.getFullYear(), m = NOW.getMonth();
  return k === 'month' ? [new Date(y, m, 1), new Date(y, m + 1, 1)] : k === 'quarter' ? [new Date(y, m - m % 3, 1), new Date(y, m - m % 3 + 3, 1)] : [new Date(y, 0, 1), new Date(y + 1, 0, 1)]; }
const rgLabel = k => { const [a, b] = range(k); const e = new Date(+b - 864e5); return `${a.getDate()}/${a.getMonth() + 1} – ${e.getDate()}/${e.getMonth() + 1}/${e.getFullYear()}`; };
const barCls = p => p == null ? '' : p >= 100 ? 'ok' : p >= 50 ? 'mid' : 'low';
const bar = p => p == null ? '<span class="nil">Chưa đặt chỉ tiêu</span>' : `<span class="bar"><span class="t"><i class="${barCls(p)}" style="width:${Math.min(100, p)}%"></i></span><b>${p}%</b></span>`;
const st = (() => { try { return { rg:'month', view:'all', q:'', sort:{ k:'wonSum', dir:'desc' }, ...JSON.parse(localStorage.getItem('hx-crm-sales-ui') || '{}'), q:'' }; } catch { return { rg:'month', view:'all', q:'', sort:{ k:'wonSum', dir:'desc' } }; } })();
const saveSt = () => { try { localStorage.setItem('hx-crm-sales-ui', JSON.stringify({ rg:st.rg, view:st.view, sort:st.sort })); } catch {} };
let MODE = 'BOARD'; // Kiểu hiển thị danh sách: mặc định Board (Kanban) theo Team mỗi lần vào trang
const fp = $('#fpop');
function openFp(anchor, html, w = 260) { const a = anchor.getBoundingClientRect(); fp.style.width = w + 'px'; fp.innerHTML = html; fp.style.left = Math.max(8, Math.min(a.right - w, innerWidth - w - 8)) + 'px'; fp.classList.add('open'); const h = fp.offsetHeight; fp.style.top = (a.bottom + 4 + h > innerHeight - 8 ? Math.max(8, a.top - h - 4) : a.bottom + 4) + 'px'; return fp; }
const closeFp = () => fp.classList.remove('open');
const rgSeg = () => `<span class="segtxt" role="group" aria-label="Kỳ">${RANGES.map(([k, l]) => `<button data-rg="${k}" aria-pressed="${st.rg === k}">${l}</button>`).join('')}</span><span class="rg">${rgLabel(st.rg)}</span>`;

/* ── Panel "Thêm từ thành viên": sale lấy từ danh sách thành viên có sẵn trên hệ thống (collection NhanVien của ERP), không tạo người mới ở đây ── */
const MEMBERS = [ // dữ liệu mẫu của NhanVien
  ['Minh Trần','minh.tran@harnex.ai','0901 234 567','Kinh doanh'],['Lan Lê','lan.le@harnex.ai','0912 345 678','Kinh doanh'],['Phương Nguyễn','phuong.nguyen@harnex.ai','0987 654 321','Kinh doanh'],
  ['Hà Vũ','ha.vu@harnex.ai','0903 111 222','Kinh doanh'],['Quang Đỗ','quang.do@harnex.ai','0904 333 444','Kinh doanh'],['Thảo Phạm','thao.pham@harnex.ai','0905 555 666','Chăm sóc khách hàng'],['Khánh Bùi','khanh.bui@harnex.ai','0906 777 888','Marketing'],['Tú Hoàng','tu.hoang@harnex.ai','0907 999 000','Kế toán']];
function salePanel() {
  const p = $('#panel'), pick = new Set(); let q = '';
  const list = () => MEMBERS.filter(m => !q || (m[0] + ' ' + m[1] + ' ' + m[3]).toLowerCase().includes(q));
  const rowsH = () => list().map(m => { const is = !!HXC.saleByName(m[0]); return `<label class="mi mb-i ${is ? 'dis' : ''}"><input type="checkbox" data-mb="${esc(m[0])}" ${is ? 'checked disabled' : pick.has(m[0]) ? 'checked' : ''}><span class="x"><b>${esc(m[0])}</b><small>${esc(m[1])} · ${esc(m[3])}</small></span>${is ? '<span class="tag">Đã là sale</span>' : ''}</label>`; }).join('') || '<div class="wempty"><span class="ms">search_off</span>Không tìm thấy thành viên.</div>';
  p.innerHTML = `<div class="pn-h"><h2>Thêm sale từ thành viên</h2><button class="btn btn--text btn--icon" data-pclose aria-label="Đóng"><span class="ms">close</span></button></div>
    <div class="pn-b"><p class="nil" style="font-size:13px;margin-bottom:10px">Chọn từ danh sách thành viên có sẵn trên hệ thống. Thành viên được chọn sẽ xuất hiện trong danh sách chọn Contact owner / Company owner và “Sale phụ trách” của Deal.</p>
      <label class="srch2" style="margin-bottom:8px"><input id="mbQ" placeholder="Tìm tên, email, phòng ban" aria-label="Tìm thành viên"><span class="ms sm">search</span></label><div id="mbL">${rowsH()}</div></div>
    <div class="pn-f"><button class="btn btn--primary" id="mbAdd" disabled>Thêm</button><button class="btn btn--text" data-pclose>Huỷ</button></div>`;
  const sync = () => { const b = $('#mbAdd', p); b.disabled = !pick.size; b.textContent = pick.size ? `Thêm ${pick.size} thành viên` : 'Thêm'; };
  $('#mbQ', p).oninput = e => { q = e.target.value.trim().toLowerCase(); $('#mbL', p).innerHTML = rowsH(); };
  p.onchange = e => { const n = e.target.dataset.mb; if (n) { e.target.checked ? pick.add(n) : pick.delete(n); sync(); } };
  p.onclick = e => { if (e.target.closest('[data-pclose]')) HX.closePanel();
    if (e.target.closest('#mbAdd') && pick.size) { MEMBERS.filter(m => pick.has(m[0])).forEach(m => HXC.createSale({ name:m[0], email:m[1], phone:m[2], role:'Sales Executive', quota:null, joined:NOW.toISOString().slice(0, 10) })); const n = pick.size; HX.closePanel(); toast(`Đã thêm ${n} thành viên vào Đội sale`); draw(); } };
  p.onkeydown = null; p.classList.add('open'); document.body.classList.add('panel-open'); document.body.classList.remove('dock'); $('#mbQ', p).focus();
}

/* ═══ DANH SÁCH ═══ */
const COLS = [
  ['role','Vai trò'],['contacts','Contacts','n'],['companies','Companies','n'],['open','Deal đang mở','n'],['pipeline','Giá trị pipeline','n'],['forecast','Dự báo (theo tỷ lệ)','n'],
  ['wonSum','Doanh số thắng','n'],['quota','Chỉ tiêu','n'],['pct','% đạt chỉ tiêu'],['winRate','Tỷ lệ thắng','n'],['acts30','Hoạt động 30 ngày','n'],['overdue','Task quá hạn','n']];
function rows() {
  const [a, b] = range(st.rg);
  return HXC.sales().map(s => { const x = HXC.saleStats(s.values.name, a, b);
    return { s, x, status:s.values.status || 'Đang làm việc', role:s.values.role, contacts:x.contacts.length, companies:x.companies.length, open:x.open.length, pipeline:x.pipeline, forecast:x.forecast, wonSum:x.wonSum, quota:x.quota, pct:x.pct ?? -1, winRate:x.winRate ?? -1, acts30:x.acts30, overdue:x.overdue.length, name:s.values.name }; });
}
function drawList() {
  document.title = 'Đội sale — Sales — HarnexAI CRM (mockup)';
  const all = rows(), ranked = [...all].sort((a, b) => b.wonSum - a.wonSum || b.pipeline - a.pipeline);
  const rank = new Map(ranked.map((r, i) => [r.s.id, i + 1]));
  let list = all.filter(r => !st.q || [r.name, r.s.values.email, r.role].join(' ').toLowerCase().includes(st.q));
  const { k, dir } = st.sort; list.sort((a, b) => { const va = a[k], vb = b[k]; const c = typeof va === 'number' ? va - vb : String(va || '').localeCompare(String(vb || ''), 'vi'); return dir === 'asc' ? c : -c; });
  $('#frame').className = 'frame';
  $('#frame').innerHTML = `
    ${wsHead(`<span class="count">${HXC.sales().length} sale</span><button class="btn btn--secondary" id="csvBtn"><span class="ms sm">ios_share</span>Export</button><button class="btn btn--primary" id="addSale"><span class="ms sm">person_add</span>Thêm từ thành viên</button>`)}
    <div class="tools"><label class="search"><span class="ms sm">search</span><input id="q" placeholder="Tìm tên, email" value="${esc(st.q)}" aria-label="Tìm sale"></label>${rgSeg()}<div class="seg" role="group" aria-label="Kiểu hiển thị"><button data-mode="BOARD" title="Board" aria-label="Board" aria-pressed="${MODE === 'BOARD'}"><span class="ms sm">view_kanban</span></button><button data-mode="TABLE" title="Bảng" aria-label="Bảng" aria-pressed="${MODE === 'TABLE'}"><span class="ms sm">table_rows</span></button></div></div>
    ${MODE === 'BOARD' ? `<div class="body brd">${boardHtml(list, rank)}</div>` : `<div class="body"><table class="lt"><thead><tr><th class="nmcol" data-sort="name">Sale${srt('name')}</th>${COLS.map(([k, l, n]) => `<th class="${n ? 'num' : ''}" data-sort="${k}">${l}${srt(k)}</th>`).join('')}</tr></thead>
      <tbody>${list.map(r => `<tr data-id="${r.s.id}" class="${r.s.values.status && r.s.values.status !== 'Đang làm việc' ? 'st-off' : ''}"><td class="nmcol"><div class="pri"><span class="rk ${rank.get(r.s.id) === 1 && r.wonSum ? 'g1' : ''}" title="Hạng theo doanh số thắng">${rank.get(r.s.id)}</span><span class="av sm">${esc(HXC.initials(r.name))}</span><div style="min-width:0"><a href="?id=${r.s.id}">${esc(r.name)}</a><small>${esc(r.s.values.email || '')}</small></div></div></td>
        <td>${esc(r.role || '—')}</td><td class="num">${r.contacts}</td><td class="num">${r.companies}</td><td class="num">${r.open}</td><td class="num">${short(r.pipeline)}</td><td class="num">${short(r.forecast)}</td>
        <td class="num"><b>${short(r.wonSum)}</b></td><td class="num">${r.quota ? short(r.quota) : '—'}</td><td>${bar(r.x.pct)}</td><td class="num">${r.x.winRate == null ? '—' : r.x.winRate + '%'}</td><td class="num">${r.acts30}</td><td class="num">${r.overdue ? `<span class="od">${r.overdue}</span>` : 0}</td></tr>`).join('')
        || `<tr><td colspan="${COLS.length + 1}" class="empty">Không có sale phù hợp.</td></tr>`}</tbody></table></div>`}
    <div class="foot"><span class="pillc">${list.length} sale</span><span>Chỉ tiêu kỳ = chỉ tiêu tháng × số tháng của kỳ. ${MODE === 'BOARD' ? 'Kéo thẻ sang cột khác để đổi trạng thái, bấm thẻ để xem chi tiết.' : 'Bấm tên cột để sắp xếp, bấm dòng để xem chi tiết.'}</span></div>`;
}
const srt = k => st.sort.k === k ? `<span class="ms xs srt">${st.sort.dir === 'asc' ? 'arrow_upward' : 'arrow_downward'}</span>` : '';
function boardHtml(list, rank) {
  const teams = HXC.SALE_FIELDS.find(f => f.key === 'status').choices; // cột = Trạng thái của sale (không chia team theo khu vực)
  return `<div class="kb">${teams.map(t => { const items = list.filter(r => r.status === t);
    return `<section class="kcol"><div class="kh">${esc(t)}<span class="n">${items.length}</span><span class="sm2">${short(items.reduce((s, r) => s + r.wonSum, 0))}</span></div><div class="kcards" data-drop="${esc(t)}">${items.map(r => `<article class="kc ${r.s.values.status && r.s.values.status !== 'Đang làm việc' ? 'st-off' : ''}" draggable="true" data-card="${r.s.id}">
      <div class="pri"><span class="rk ${rank.get(r.s.id) === 1 && r.wonSum ? 'g1' : ''}" title="Hạng theo doanh số thắng">${rank.get(r.s.id)}</span><span class="av sm">${esc(HXC.initials(r.name))}</span><div style="min-width:0"><a href="?id=${r.s.id}">${esc(r.name)}</a><small>${esc(r.role || '')}</small></div></div>
      <div class="ln"><span>Doanh số thắng</span><b>${short(r.wonSum)}</b></div>${bar(r.x.pct)}
      <div class="ln"><span>Deal đang mở</span><b>${r.open} · ${short(r.pipeline)}</b></div>
      <div class="ln"><span>Hoạt động 30 ngày</span><b>${r.acts30}</b></div>${r.overdue ? `<div class="ln"><span>Task quá hạn</span><b class="od">${r.overdue}</b></div>` : ''}</article>`).join('') || '<div class="kempty">Không có sale</div>'}</div></section>`; }).join('')}</div>`;
}
function exportCsv() {
  const list = rows(), head = ['Sale','Email', ...COLS.map(c => c[1])];
  const csv = [head, ...list.map(r => [r.name, r.s.values.email, r.role, r.contacts, r.companies, r.open, r.pipeline, Math.round(r.forecast), r.wonSum, r.quota, r.x.pct ?? '', r.x.winRate ?? '', r.acts30, r.overdue])].map(a => a.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type:'text/csv' })); a.download = `sales-${st.rg}.csv`; a.click(); toast('Đã xuất CSV');
}

/* ═══ CHI TIẾT ═══ */
const IC = { NOTE:'edit_note', CALL:'call', MEETING:'event', TASK:'task_alt', EMAIL:'mail' }, TN = { NOTE:'Ghi chú', CALL:'Cuộc gọi', MEETING:'Cuộc họp', TASK:'Task', EMAIL:'Email' };
function refOf(a) { const t = a.deals && a.deals[0] ? ['deal', a.deals[0]] : a.contacts && a.contacts[0] ? ['contact', a.contacts[0]] : a.companies && a.companies[0] ? ['company', a.companies[0]] : null;
  if (!t) return ''; const r = HXC.get(t[0], t[1]); return r ? ` · <a href="${HXC.url(t[0], t[1])}">${esc(HXC.titleOf(t[0], r))}</a>` : ''; }
function drawDetail(s) {
  const name = s.values.name; document.title = `${name} — Sales`;
  const [a, b] = range(st.rg), x = HXC.saleStats(name, a, b), today = NOW.toISOString().slice(0, 10);
  const byStage = HX.STAGES.map(sg => { const ds = x.deals.filter(d => d.values[HXC.STAGE] === sg); return [sg, ds.length, ds.reduce((t, d) => t + (Number(d.values[HXC.CASH]) || 0), 0)]; });
  const maxV = Math.max(1, ...byStage.map(r => r[2]));
  const todo = [...x.overdue, ...x.upcoming.filter(t => !x.overdue.includes(t))].slice(0, 8);
  $('#frame').className = 'frame rec';
  $('#frame').innerHTML = `<div class="grid">
    <div class="col">
      <section class="card"><div class="top"><a class="back" href="crm-sales-hubspot.html?tab=team"><span class="ms sm">chevron_left</span>Đội sale</a><button class="btn btn--text sm" id="actBtn" aria-haspopup="menu">Thao tác<span class="ms xs">arrow_drop_down</span></button></div>
        <div class="idt"><span class="ic">${esc(HXC.initials(name))}</span><div style="min-width:0"><h1>${esc(name)}</h1><div class="nil" style="font-size:13px">${esc(s.values.role || '')}</div></div></div>
        <div class="sub">${s.values.email ? `<a href="mailto:${esc(s.values.email)}">${esc(s.values.email)}</a>` : ''}${s.values.phone ? `<span>${esc(s.values.phone)}</span>` : ''}</div>
        <div class="qa">${s.values.email ? `<a href="mailto:${esc(s.values.email)}"><span class="o"><span class="ms sm">mail</span></span>Email</a>` : ''}${s.values.phone ? `<a href="tel:${esc(s.values.phone.replace(/\s/g, ''))}"><span class="o"><span class="ms sm">call</span></span>Gọi</a>` : ''}
          <a href="crm-giao-dich-hubspot.html"><span class="o"><span class="ms sm">handshake</span></span>Deals</a><a href="crm-bao-cao-hubspot.html"><span class="o"><span class="ms sm">bar_chart</span></span>Báo cáo</a></div></section>
      <section class="card"><div class="ch">Thông tin sale</div><div class="cb"><div class="props" id="sp"></div></div><div class="meta">Ngày tạo: ${HXC.dt(s.createdAt)}</div></section>
    </div>
    <div class="col">
      <section class="card"><div class="ch">Hiệu suất</div><div class="cb"><div class="perf-rg">${rgSeg()}</div>
        <div class="dk">
          <div class="kpi"><div class="l">Doanh số thắng</div><div class="v">${short(x.wonSum)}</div><div class="s">${x.won.length} deal Closed Won</div></div>
          <div class="kpi"><div class="l">Chỉ tiêu kỳ</div><div class="v">${x.quota ? short(x.quota) : '—'}</div><div class="s">${bar(x.pct)}</div></div>

}
function taskDialog(preset = {}) {
  const cts = HXC.list('contact'), dls = HXC.list('deal');
  HX.modal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="tkT"><div class="mh" id="tkT">Tạo task<button class="btn btn--text btn--icon x" data-close aria-label="Đóng"><span class="ms">close</span></button></div>
    <div class="mb"><form class="field-form" id="tkF"><label>Tiêu đề <span class="req">*</span><input class="in" id="tk_title" value="${esc(preset.title || '')}"></label>
      <label>Hạn<input class="in" id="tk_due" type="date" value="${preset.due || tomorrowS}"></label>
      <label>Ưu tiên<select class="in" id="tk_prio">${['Thấp','Trung bình','Cao'].map(p => `<option ${p === 'Trung bình' ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
      <label>Giao cho<select class="in" id="tk_as">${HXC.sales().map(s => `<option ${s.values.name === (ws.who === '*' ? HXC.ME : ws.who) ? 'selected' : ''}>${esc(s.values.name)}</option>`).join('')}</select></label>
      <label>Liên kết Contact<select class="in" id="tk_ct"><option value="">— Không —</option>${cts.map(c => `<option value="${c.id}" ${(preset.contacts || [])[0] === c.id ? 'selected' : ''}>${esc(HXC.fullName(c))}</option>`).join('')}</select></label>
      <label>Liên kết Deal<select class="in" id="tk_dl"><option value="">— Không —</option>${dls.map(d => `<option value="${d.id}" ${(preset.deals || [])[0] === d.id ? 'selected' : ''}>${esc(HX.title(d))} — ${esc(d.values.t_n_deal || '')}</option>`).join('')}</select></label>
      <p class="err" id="tkE" role="alert"></p></form></div>
    <div class="mf"><button class="btn btn--secondary" data-close>Huỷ</button><button class="btn btn--primary" id="tkOk">Tạo</button></div></div>`, (bg, close) => {
    setTimeout(() => $('#tk_title', bg).focus(), 40);
    $('#tkOk', bg).onclick = () => { const title = $('#tk_title', bg).value.trim(); if (!title) { $('#tkE', bg).textContent = 'Nhập tiêu đề task'; return; }
      const ct = $('#tk_ct', bg).value, dl = $('#tk_dl', bg).value, c = ct && HXC.get('contact', ct);
      HXC.addActivity({ type:'TASK', title, body:title, due: $('#tk_due', bg).value || null, done:false, prio: $('#tk_prio', bg).value, assignee: $('#tk_as', bg).value, contacts: ct ? [ct] : [], companies: c && c.company ? [c.company] : (preset.companies || []), deals: dl ? [dl] : [] });
      close(); toast('Đã tạo task'); draw(); }; });
}
document.addEventListener('click', e => {
  if (qs.get('id')) return;
  const wb = e.target.closest('#whoBtn'); if (wb) { e.stopImmediatePropagation(); openFp(wb, `<div class="hd">Xem theo</div>${[['*', 'Tất cả sales'], [HXC.ME, 'Tôi (' + HXC.ME + ')'], ...HXC.sales().filter(s => s.values.name !== HXC.ME).map(s => [s.values.name, s.values.name])].map(([v, l]) => `<button class="mi" data-who="${esc(v)}"><span class="ms sm" style="${v === ws.who ? '' : 'visibility:hidden'}">check</span>${esc(l)}</button>`).join('')}`, 280);
    const r = wb.getBoundingClientRect(); fp.style.left = Math.max(8, r.left) + 'px'; return; }
  const w = e.target.closest('[data-who]'); if (w) { ws.who = w.dataset.who; saveWs(); closeFp(); draw(); return; }
  const tg = e.target.closest('[data-wtg]'); if (tg) { ws.shut[tg.dataset.wtg] = !ws.shut[tg.dataset.wtg]; saveWs(); draw(); return; }
  const tf = e.target.closest('[data-tf]'); if (tf) { ws.tf = ws.tf === tf.dataset.tf ? 'all' : tf.dataset.tf; draw(); return; }
  const gf = e.target.closest('[data-gf]'); if (gf) { ws.gf = gf.dataset.gf; draw(); return; }
  if (e.target.closest('#wsTask')) { taskDialog(); return; }
  const fu = e.target.closest('[data-fu]'); if (fu) { const m = HXC.db().activities.find(a => a.id === fu.dataset.fu); if (m) taskDialog({ title:'Follow-up: ' + (m.title || 'cuộc họp'), contacts:m.contacts, companies:m.companies, deals:m.deals }); return; }
  if (e.target.closest('#wsStart')) { const D = wsData(), l = ws.tf === 'all' ? [...D.grp.od, ...D.grp.today, ...D.grp.tmr, ...D.grp.later] : D.grp[ws.tf]; if (l.length) taskQueue(l.map(t => t.id)); return; }
});
document.addEventListener('change', e => { const id = e.target.dataset && e.target.dataset.tdone; if (id) { HXC.updateActivity(id, { done: e.target.checked }); toast(e.target.checked ? 'Đã hoàn thành task' : 'Đã mở lại task'); draw(); } });

/* ── Điều phối ── */
function draw() { const s = qs.get('id') && HXC.saleById(qs.get('id')); if (qs.get('id') && !s) { $('#frame').innerHTML = `<div class="soon"><span class="ms">search_off</span>Không tìm thấy sale.<a class="btn btn--secondary" href="crm-sales-hubspot.html">Về Sales</a></div>`; return; } s ? drawDetail(s) : ({ summary:drawSummary, team:drawList, tasks:drawTasks, schedule:drawSchedule, feed:drawFeed, leads:drawWsLeads, deals:drawWsDeals, goals:drawGoals }[TAB] || drawSoon)(); }
draw();
HX.onChange = draw;
// Board Đội sale: kéo thẻ sang cột khác = đổi Trạng thái của sale
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.kc[data-card]'); if (c) { c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.card); } });
document.addEventListener('dragend', e => e.target.closest && e.target.closest('.kc')?.classList.remove('dragging'));
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('drop'); } });
document.addEventListener('dragleave', e => e.target.closest && e.target.closest('[data-drop]')?.classList.remove('drop'));
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); const s = HXC.saleById(e.dataTransfer.getData('text/plain')), t = z.dataset.drop || null;
  if (s && t && (s.values.status || 'Đang làm việc') !== t) { HXC.updateSale(s.id, 'status', t); toast(`${s.values.name}: ${t}`); } draw(); });
document.addEventListener('click', e => {
  const rg = e.target.closest('[data-rg]'); if (rg) { st.rg = rg.dataset.rg; saveSt(); draw(); return; }
  const th = e.target.closest('th[data-sort]'); if (th) { const k = th.dataset.sort; st.sort = { k, dir: st.sort.k === k && st.sort.dir === 'desc' ? 'asc' : 'desc' }; saveSt(); draw(); return; }
  const md = e.target.closest('[data-mode]'); if (md) { MODE = md.dataset.mode; draw(); return; }
  const kc = e.target.closest('.kc[data-card]'); if (kc && !e.target.closest('a')) { location.href = '?id=' + kc.dataset.card; return; }
  if (e.target.closest('#addSale')) { salePanel(); return; }
  if (e.target.closest('#csvBtn')) { exportCsv(); return; }
  const tr = e.target.closest('tbody tr[data-id]'); if (tr && !e.target.closest('a')) { location.href = '?id=' + tr.dataset.id; return; }
  if (e.target.closest('[data-fx]')) { closeFp(); return; }
  const ab = e.target.closest('#actBtn'); if (ab) { e.stopPropagation(); const s = HXC.saleById(qs.get('id'));
    openFp(ab, `<button class="mi" data-ra><span class="ms sm">swap_horiz</span>Chuyển giao bản ghi cho sale khác</button><a class="mi" href="crm-quan-he-hubspot.html"><span class="ms sm">schema</span>Xem sơ đồ quan hệ dữ liệu</a><div class="sep"></div>
      <button class="mi" data-off><span class="ms sm">${s.values.status === 'Đang làm việc' ? 'person_off' : 'person_check'}</span>${s.values.status === 'Đang làm việc' ? 'Đánh dấu đã nghỉ' : 'Đánh dấu đang làm việc'}</button>`, 280); fp.dataset.src = 'act'; return; }
  if (e.target.closest('[data-ra]')) { e.stopPropagation(); reassign(HXC.saleById(qs.get('id')), $('#actBtn')); return; }
  if (e.target.closest('[data-off]')) { const s = HXC.saleById(qs.get('id')); const on = s.values.status === 'Đang làm việc'; closeFp();
    if (on) confirmBox('Đánh dấu đã nghỉ', `${esc(s.values.name)} vẫn giữ các bản ghi đang sở hữu. Nên dùng “Chuyển giao bản ghi” trước khi đánh dấu nghỉ.`, 'Đánh dấu nghỉ', () => { HXC.updateSale(s.id, 'status', 'Đã nghỉ'); toast('Đã cập nhật trạng thái'); draw(); });
    else { HXC.updateSale(s.id, 'status', 'Đang làm việc'); toast('Đã cập nhật trạng thái'); draw(); } return; }
  if (!e.target.closest('#fpop')) closeFp();
});
document.addEventListener('input', e => { if (e.target.id === 'q') { st.q = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; draw(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFp(); });
</script>
</body>
</html>
